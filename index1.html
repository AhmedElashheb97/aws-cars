<!--
================================================================
  منظومة AWS لاستيراد السيارات (Copart / IAAI) — ملف واحد
================================================================
  التشغيل السريع:
  - بدون إعداد: افتح الملف وسيعمل في "الوضع التجريبي" (البيانات في المتصفح فقط).
  - للتشغيل الفعلي مع Firebase:
    1) أنشئ مشروع في console.firebase.google.com
    2) Build > Authentication > Sign-in method > فعّل Email/Password
       ثم من تبويب Users أضف حسابات الموظفين (3 مستخدمين مثلاً).
    3) Build > Firestore Database > Create database
    4) Firestore > Rules والصق القواعد التالية ثم Publish:

    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        function staff() {   // اكتب إيميلات الموظفين فقط — أي إيميل غيرهم يترفض
          return request.auth != null && request.auth.token.email in ['email1@gmail.com', 'email2@gmail.com', 'email3@gmail.com'];
        }
        match /{document=**} { allow read, write: if staff(); }
        match /tracking/{vin} { allow get: if true; }   // صفحة التتبع العامة (بحث برقم VIN فقط)
        match /settings/{id}  { allow get: if true; }   // اسم المكتب ورقمه في صفحة التتبع
      }
    }

    5) Project settings > Your apps > Web app، وانسخ firebaseConfig والصقه في الأسفل.
    6) Netlify: اسحب المجلد الذي فيه index.html إلى app.netlify.com/drop
       ثم أضف دومين Netlify في Firebase > Authentication > Settings > Authorized domains.

  رابط التتبع للزبون:  https://موقعك.netlify.app/?vin=رقم_الهيكل
================================================================
-->
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--pri:#2563eb;--pri2:#1d4ed8;--acc:#f97316;--red:#dc2626;--green:#059669;--side:#0f172a;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
a{color:var(--pri)}
h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:15px;margin:0 0 12px}
.mut,.sub{color:var(--mut)} .sub{font-size:12px}
.layout{display:flex;min-height:100vh}
.side{width:236px;background:var(--side);color:#cbd5e1;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;font-weight:800;font-size:15px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#fb923c);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:600;border-inline-start:3px solid transparent;white-space:nowrap}
.nav a:hover{background:#1e293b;color:#fff}
.nav a.on{background:#1e293b;color:#fff;border-inline-start-color:var(--acc)}
.nav .cnt{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;font-size:12px;color:#94a3b8;display:flex;flex-direction:column;gap:6px;padding:8px}
.side-foot button{background:#1e293b;color:#e2e8f0;border:0;border-radius:8px;padding:7px;font:inherit;cursor:pointer}
.main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{font-size:13px;text-decoration:none;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.row-b h3{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{display:flex;gap:12px;align-items:center;border-top:3px solid var(--c)}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 12%,white);flex-shrink:0}
.stat .v{font-size:22px;font-weight:800;direction:ltr;text-align:start}
.stat .k{color:var(--mut);font-size:12.5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.red{color:var(--red);border-color:#fecaca}
.btn.red.solid{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.wide{width:100%;justify-content:center;padding:11px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{color:var(--mut);font-size:12px;font-weight:700;background:var(--soft)}
tr.click{cursor:pointer} tr.click:hover{background:var(--soft)}
tr.late{background:#fef2f2} tr.late:hover{background:#fee2e2}
.neg{color:var(--red);font-weight:700} .pos{color:var(--green);font-weight:700}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,white);border:1px solid color-mix(in srgb,var(--c) 30%,white);white-space:nowrap}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate;letter-spacing:.4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
label.f{display:block}
label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:700}
.sec{font-weight:800;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line);color:var(--pri2)}
.totbox{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.err{background:#fef2f2;color:var(--red);border-radius:10px;padding:8px 12px;margin:10px 0;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:30px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:16px;width:100%;max-width:840px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:520px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.lb{background:transparent;box-shadow:none;max-width:1100px;padding:0;text-align:center}
.lb img{max-width:100%;max-height:85vh;border-radius:12px}
.alert{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r);padding:14px 16px}
.alert-h{color:var(--red);font-weight:800;margin-bottom:8px}
.alert-row{display:flex;gap:14px;align-items:center;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink);flex-wrap:wrap}
.alert-row:hover{background:#fee2e2}
.advtag{display:inline-block;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:99px;font-size:11px;font-weight:700;padding:0 8px;margin-inline-start:4px}.advtag.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.alert.orange{background:#fff7ed;border-color:#fed7aa}.alert.orange .alert-h{color:#c2410c}.pill-or{background:#ea580c;color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.pill-red{background:var(--red);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin-inline-start:auto}
.banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.sbar{display:grid;grid-template-columns:170px 1fr 34px;gap:10px;align-items:center;padding:5px 0;color:var(--ink);text-decoration:none;font-size:13px}
.sbar:hover span{color:var(--pri)}
.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px}
.sbar b{text-align:end}
.pipe{display:flex;overflow-x:auto;padding:8px 0 4px}
.step{flex:1;min-width:84px;text-align:center;position:relative}
.step::before{content:'';position:absolute;top:15px;inset-inline-start:50%;width:100%;height:3px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--green)}
.step.clk{cursor:pointer} .step.clk:hover .dot{border-color:var(--pri)}
.dot{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto;display:grid;place-items:center;font-weight:800;position:relative;z-index:1;font-size:13px;color:var(--mut)}
.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.cur .dot{border-color:var(--pri);color:#fff;background:var(--pri);box-shadow:0 0 0 5px #dbeafe}
.lbl{font-size:11.5px;margin-top:7px;font-weight:700;color:var(--mut);padding:0 3px}
.cur .lbl{color:var(--pri)} .done .lbl{color:var(--ink)}
.dt{font-size:10.5px;color:var(--mut)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.info>div>span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.info>div>b{font-weight:700}
.fin td{white-space:normal} .fin td:last-child{text-align:end;direction:ltr;font-weight:700}
.fin tr.t td{font-size:15px;font-weight:800;background:var(--soft)}
.internal{margin-top:12px;border:1px dashed #fdba74;background:#fff7ed;border-radius:12px;padding:10px 14px;font-size:13px}
.internal b{direction:ltr;display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-weight:700;font-size:12.5px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gi{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--soft);aspect-ratio:4/3}
.gi img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.gi .tag{position:absolute;bottom:6px;inset-inline-start:6px;background:rgba(15,23,42,.75);color:#fff;font-size:11px;border-radius:6px;padding:1px 7px}
.gi .x{position:absolute;top:6px;inset-inline-end:6px;background:rgba(220,38,38,.9);color:#fff;border:0;border-radius:7px;width:26px;height:26px;cursor:pointer;font-weight:800}
.addimg{display:grid;grid-template-columns:150px 1fr auto auto;gap:8px;margin-top:14px;align-items:center}
.fileb{position:relative;overflow:hidden}
.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ccard{display:flex;justify-content:space-between;gap:10px}
.vinrow{display:flex;gap:6px}.vinrow input{flex:1}
.vmsg{font-size:12px;margin-top:3px;min-height:16px}.vmsg.ok{color:var(--green)}.vmsg.bad{color:var(--red)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.bulk b{color:var(--pri2)}.bulk select,.bulk input{width:auto;min-width:150px}
td.cb,th.cb{width:36px;padding-inline-end:0}td.cb input,th.cb input{width:17px;height:17px;cursor:pointer}
tr.sel{background:#eff6ff}
.btn.wa{background:#16a34a;border-color:#16a34a;color:#fff}.btn.wa:hover{background:#15803d}
.when{font-size:12px;color:var(--mut);white-space:nowrap}
.age{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#f1f5f9;color:#475569}
.age.mid{background:#fff7ed;color:#c2410c}.age.old{background:#fef2f2;color:#b91c1c}
.ocars{font-size:12px;color:var(--mut);line-height:1.5;white-space:normal;min-width:180px}
.sortb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tst.err{background:var(--red)}
.login,.pub{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,#1e3a8a 0,#0f172a 60%)}
.lcard{width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:12px}
.lcard form{display:flex;flex-direction:column;gap:12px;text-align:start}
.logo{width:62px;height:62px;border-radius:18px;margin:0 auto;background:linear-gradient(135deg,var(--acc),#fb923c);display:grid;place-items:center;font-size:32px}
.lnk{font-weight:700;text-decoration:none}
.pub{justify-content:flex-start;gap:16px;padding-top:50px}
.pub-h{text-align:center;color:#fff}
.pub-h h1{justify-content:center;font-size:26px;margin-top:12px}
.pub-h p{color:#cbd5e1;margin:4px 0 0}
.pub>.card,#pres{width:100%;max-width:860px}
#pres{display:flex;flex-direction:column;gap:14px}
.pub-s form{display:flex;gap:10px}
.big{font-size:18px;padding:12px 14px;text-align:center}
.pub-f{color:#94a3b8;font-size:13px;text-align:center}
.pub-f a{color:#cbd5e1}
@media(max-width:960px){.two,.filters{grid-template-columns:1fr}}
/* ===== عناصر وضع التطبيق (تظهر على الموبايل فقط) ===== */
.mtop,.bnav,.fab,.mcards{display:none}
.sheet-list{display:flex;flex-direction:column;gap:4px}
.sheet-list a,.sheet-list button{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font:inherit;font-weight:700;background:none;border:0;text-align:start;cursor:pointer;width:100%}
.sheet-list a:active,.sheet-list button:active{background:var(--soft)}
.sheet-list .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--soft);flex-shrink:0}
.sheet-list .cnt{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 8px}
.mc{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;position:relative}
.mc+.mc{margin-top:10px}
.mc.late{border-color:#fecaca;background:#fef2f2}.mc.sel{border-color:#93c5fd;background:#eff6ff}
.mc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mc-h b{font-size:15px}
.mc-s{font-size:12px;color:var(--mut);margin-top:2px}
.mc-r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.mc-r b{font-size:15px;direction:ltr}
.mc-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
.mc-a{display:flex;gap:6px;margin-top:10px}.mc-a .btn{flex:1;justify-content:center}
.mcb{position:absolute;top:10px;inset-inline-start:10px}.mcb input{width:20px;height:20px}
.mc.hascb{padding-inline-start:42px}
@media(max-width:860px){
 body{-webkit-tap-highlight-color:transparent;background:var(--bg)}
 input,select,textarea{font-size:16px}
 .side{display:none}
 .layout{display:block}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--side);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
 .mtop .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#fb923c);display:grid;place-items:center;font-size:18px}
 .mtop b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mtop button{background:#1e293b;color:#e2e8f0;border:0;border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700}
 .main{padding:12px 12px calc(92px + env(safe-area-inset-bottom));gap:12px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,23,42,.06)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:700;padding:4px 0;position:relative}
 .bnav a i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
 .bnav a.on{color:var(--pri)}.bnav a.on i{filter:none;opacity:1}
 .bnav .dotc{position:absolute;top:0;left:50%;margin-left:6px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
 .fab{display:grid;place-items:center;position:fixed;z-index:41;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-start:16px;width:56px;height:56px;border-radius:18px;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(37,99,235,.4);cursor:pointer}
 .banner{font-size:12.5px;padding:8px 12px}
 .top{align-items:flex-start;gap:8px}
 h1{font-size:19px}
 .top .acts{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
 .top .acts::-webkit-scrollbar{display:none}
 .card{padding:14px;border-radius:14px}
 .stats{grid-template-columns:1fr 1fr;gap:10px}
 .stat{padding:12px;gap:9px;align-items:flex-start}
 .stat .ic{width:34px;height:34px;font-size:17px;border-radius:10px}
 .stat .v{font-size:17px}.stat .k{font-size:11.5px;line-height:1.35}
 .info{grid-template-columns:1fr 1fr;gap:10px 12px}
 .tw.dt{display:none}
 .mcards{display:block}
 .bulk{flex-direction:column;align-items:stretch}.bulk select,.bulk input{width:100%}
 .addimg{grid-template-columns:1fr 1fr}
 .sbar{grid-template-columns:120px 1fr 28px}
 .alert-row{gap:8px;font-size:13px}
 .modal-bg{align-items:flex-end;padding:0}
 .modal{max-width:none!important;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
 .modal::before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:#cbd5e1;margin:-6px auto 12px}
 .modal.lb{background:#000;border-radius:0;max-height:100vh;height:100vh;display:grid;place-items:center}.modal.lb::before{display:none}
 .mfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;margin:14px -16px calc(-16px - env(safe-area-inset-bottom));padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
 .mfoot .btn{flex:1;justify-content:center;padding:11px}
 #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
 .pipe{flex-direction:column;overflow:visible;padding:4px 0}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script type="module">
/* ================= إعدادات Firebase — الصق إعدادات مشروعك هنا ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBUZNvDoSTtD_kXswnN0RWGc91mpxrKvCU",
  authDomain: "aws-cars.firebaseapp.com",
  projectId: "aws-cars",
  storageBucket: "aws-cars.firebasestorage.app",
  messagingSenderId: "297393137387",
  appId: "1:297393137387:web:31d81b675a5526e5cfc0ae"
};
/* ============================================================================ */

const LOCAL = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('PASTE');
const FBV = '10.12.2';

/* ---------------- طبقة البيانات (Firebase أو تخزين محلي تجريبي) ---------------- */
const clean = o => JSON.parse(JSON.stringify(o));
const DB = (() => {
  let fb = null; const watchers = {};
  const load = c => { try { return JSON.parse(localStorage.getItem('cop_' + c) || '{}') } catch (e) { return {} } };
  const toArr = o => Object.entries(o).map(([id, v]) => ({ id, ...v }));
  const save = (c, o) => { localStorage.setItem('cop_' + c, JSON.stringify(o)); (watchers[c] || []).forEach(f => f(toArr(o))); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const notify = c => (watchers[c] || []).forEach(f => f(toArr(load(c))));
  if (LOCAL) window.addEventListener('storage', e => { if (e.key && e.key.startsWith('cop_')) notify(e.key.slice(4)); });
  return {
    async init() {
      if (LOCAL) return;
      const base = `https://www.gstatic.com/firebasejs/${FBV}/`;
      const [app, fs, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
      const a = app.initializeApp(firebaseConfig);
      fb = { fs, au, db: fs.getFirestore(a), auth: au.getAuth(a) };
    },
    refresh() { if (LOCAL) Object.keys(watchers).forEach(notify); },
    onAuth(cb) { if (LOCAL) { cb({ email: 'demo@local' }); return; } fb.au.onAuthStateChanged(fb.auth, cb); },
    login(e, p) { return fb.au.signInWithEmailAndPassword(fb.auth, e, p); },
    logout() { if (!LOCAL) return fb.au.signOut(fb.auth); },
    watch(c, cb, opt) {
      if (LOCAL) {
        const f = arr => { if (opt) arr = arr.sort((a, b) => String(b[opt.order] || '').localeCompare(String(a[opt.order] || ''))).slice(0, opt.limit); cb(arr); };
        (watchers[c] = watchers[c] || []).push(f); f(toArr(load(c))); return () => { watchers[c] = (watchers[c] || []).filter(x => x !== f); };
      }
      const ref = opt ? fb.fs.query(fb.fs.collection(fb.db, c), fb.fs.orderBy(opt.order, 'desc'), fb.fs.limit(opt.limit)) : fb.fs.collection(fb.db, c);
      return fb.fs.onSnapshot(ref, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => toast(e.message, 'err'));
    },
    async add(c, data) {
      data = clean(data);
      if (LOCAL) { const o = load(c), id = uid(); o[id] = data; save(c, o); return id; }
      return (await fb.fs.addDoc(fb.fs.collection(fb.db, c), data)).id;
    },
    async update(c, id, data) {
      data = clean(data);
      if (LOCAL) { const o = load(c); o[id] = { ...(o[id] || {}), ...data }; save(c, o); return; }
      await fb.fs.updateDoc(fb.fs.doc(fb.db, c, id), data);
    },
    async merge(c, id, data) {
      data = clean(data);
      if (LOCAL) { const o = load(c); o[id] = { ...(o[id] || {}), ...data }; save(c, o); return; }
      await fb.fs.setDoc(fb.fs.doc(fb.db, c, id), data, { merge: true });
    },
    async del(c, id) {
      if (LOCAL) { const o = load(c); delete o[id]; save(c, o); return; }
      await fb.fs.deleteDoc(fb.fs.doc(fb.db, c, id));
    },
    async get(c, id) {
      if (LOCAL) { const o = load(c); return o[id] ? { id, ...o[id] } : null; }
      const s = await fb.fs.getDoc(fb.fs.doc(fb.db, c, id));
      return s.exists() ? { id: s.id, ...s.data() } : null;
    }
  };
})();

/* ---------------- الثوابت ---------------- */
const ST = [
  { k: 'WON_PENDING_PAYMENT', ar: 'تم الشراء - بانتظار السداد', en: 'Won - Pending Payment', c: '#dc2626' },
  { k: 'PAID', ar: 'تم السداد للمزاد', en: 'Paid to Auction', c: '#ea580c' },
  { k: 'INLAND_TRANSIT', ar: 'نقل داخلي', en: 'Inland Transit', c: '#ca8a04' },
  { k: 'AT_US_WAREHOUSE', ar: 'في مستودع التصدير', en: 'At US Warehouse', c: '#65a30d' },
  { k: 'LOADED_SHIPPED', ar: 'تم الشحن - في البحر', en: 'Loaded & Shipped', c: '#0891b2' },
  { k: 'ARRIVED_LOCAL_PORT', ar: 'وصلت الميناء المحلي', en: 'Arrived Local Port', c: '#2563eb' },
  { k: 'DELIVERED', ar: 'تم التسليم', en: 'Delivered', c: '#475569' }
];
const FIN = [
  { k: 'bid_price', ar: 'سعر الشراء في المزاد', en: 'Bid price' },
  { k: 'auction_fees', ar: 'رسوم المزاد', en: 'Auction fees' },
  { k: 'inland_shipping', ar: 'الشحن الداخلي', en: 'Inland shipping' },
  { k: 'ocean_shipping', ar: 'الشحن البحري', en: 'Ocean shipping' },
  { k: 'office_commission', ar: 'عمولة المكتب', en: 'Office commission' },
  { k: 'transfer_commission', ar: 'عمولة الحوالة', en: 'Transfer commission' },
  { k: 'other_fees', ar: 'مصاريف أخرى', en: 'Other fees' }
];
const AUCTIONS = ['Copart', 'IAAI', 'Manheim', 'Other'];
const STAGES = [{ k: 'auction', ar: 'المزاد', en: 'Auction' }, { k: 'warehouse', ar: 'المستودع', en: 'Warehouse' }, { k: 'arrival', ar: 'الوصول', en: 'Arrival' }];

/* ---------------- الحالة العامة ---------------- */
const S = {
  user: null, customers: [], vehicles: [], payments: [], loaded: {},
  settings: { office: 'AWS لاستيراد السيارات', phone: '', address: '', lateDays: 2, advDays: 7, rate: 7, note: 'شكراً لثقتكم في AWS لاستيراد السيارات' },
  lang: localStorage.getItem('cop_lang') || 'ar', route: 'dashboard', param: null,
  f: { q: '', status: '', auction: '', cust: '' }, cq: '', pf: { cust: '', cur: '' },
  trk: {}, galTab: 'all', expenses: [], logs: [], sel: new Set(), em: new Date().toISOString().slice(0, 7), lf: { user: '', act: '' }, csort: 'age', agg: { v: {}, c: {} }, after: null
};

/* ---------------- أدوات ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const L = (a, e) => S.lang === 'ar' ? a : e;
const money = n => { n = num(n); return (n < -0.004 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); };
const lyd = n => num(n).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + L('د.ل', 'LYD');
const fdate = d => d ? new Date(d).toLocaleDateString('en-GB') : '—';
const today = () => new Date().toISOString().slice(0, 10);
const now = () => new Date().toISOString();
const daysSince = d => d ? Math.max(0, Math.floor((Date.now() - new Date(d).getTime()) / 864e5)) : 0;
const stIdx = k => ST.findIndex(s => s.k === k);
const stName = k => { const s = ST[stIdx(k)]; return s ? L(s.ar, s.en) : (k || '—'); };
const stColor = k => (ST[stIdx(k)] || { c: '#64748b' }).c;
const badge = k => `<span class="badge" style="--c:${stColor(k)}">${esc(stName(k))}</span>`;
const vSpec = v => [v.trim, v.engine].filter(Boolean).join(' · ');
const custFin = v => { const f = v.fin || {}, tr = num(f.transfer_commission); const rows = [];
  if (num(f.bid_price) || tr) rows.push([tr ? L('سعر الشراء والتحويل', 'Purchase & transfer') : L('سعر الشراء في المزاد', 'Bid price'), num(f.bid_price) + tr]);
  FIN.filter(x => !['bid_price', 'transfer_commission'].includes(x.k) && num(f[x.k])).forEach(x => rows.push([L(x.ar, x.en), num(f[x.k])]));
  return rows; };
const vt = v => `${v.year || ''} ${v.make || ''} ${v.model || ''}`.trim() || '—';
const custName = id => (S.customers.find(c => c.id === id) || {}).full_name || '—';
const statusSince = v => { const h = v.status_history || []; return h.length ? h[h.length - 1].at : (v.purchase_date || v.created_at); };
const totalCost = v => FIN.reduce((s, f) => s + num((v.fin || {})[f.k]), 0);
const profit = v => { const f = v.fin || {}; const act = num(f.shipping_cost_actual); return num(f.office_commission) + num(f.transfer_commission) + (act > 0 ? num(f.inland_shipping) + num(f.ocean_shipping) - act : 0); };
const vPaid = id => S.agg.v[id] || 0;
const vBal = v => totalCost(v) - vPaid(v.id);
const cAgg = id => S.agg.c[id] || { cost: 0, paid: 0, bal: 0, count: 0, active: 0 };
const advAmt = v => v.auction_paid_by === 'office' ? num((v.fin || {}).bid_price) + num((v.fin || {}).auction_fees) : 0;
const advOut = v => { const a = advAmt(v); return a > 0 ? Math.max(0, Math.min(a, vBal(v))) : 0; };
const advTag = v => { const o = advOut(v); return o > 0.009 ? ` <span class="advtag">💸 ${L('سلفة', 'Advance')} ${money(o)}</span>` : (advAmt(v) > 0 ? ` <span class="advtag ok">✓ ${L('سلفة مسددة', 'Advance repaid')}</span>` : ''); };
function advList() {
  const lim = num(S.settings.advDays) || 7;
  return S.vehicles.filter(v => advOut(v) > 0.009).map(v => ({ v, o: advOut(v), d: daysSince(v.auction_paid_date || v.purchase_date) })).filter(x => x.d >= lim).sort((a, b) => b.d - a.d);
}
const cnt = k => S.vehicles.filter(v => v.status === k).length;
const isPublic = () => S.route === 'track' || new URLSearchParams(location.search).has('vin');
const trackUrl = vin => location.origin + location.pathname + '?vin=' + encodeURIComponent(vin);

function toast(msg, type) {
  const d = document.createElement('div'); d.className = 'tst ' + (type || ''); d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), 3000);
}
function openModal(html, cls = '') { $('#modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)A.close()"><div class="modal ${cls}">${html}</div></div>`; }
function applyDir() { document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = S.lang; }

function recompute() {
  const v = {}, c = {};
  S.customers.forEach(x => c[x.id] = { cost: 0, paid: 0, bal: 0, count: 0, active: 0 });
  S.payments.forEach(p => { if (p.vehicle_id) v[p.vehicle_id] = (v[p.vehicle_id] || 0) + num(p.amount_usd); if (c[p.customer_id]) c[p.customer_id].paid += num(p.amount_usd); });
  S.vehicles.forEach(x => { const a = c[x.customer_id]; if (a) { a.cost += totalCost(x); a.count++; if (x.status !== 'DELIVERED') a.active++; } });
  Object.values(c).forEach(a => a.bal = a.cost - a.paid);
  S.agg = { v, c };
}
function lateList() {
  const lim = num(S.settings.lateDays) || 2;
  return S.vehicles.filter(v => v.status === 'WON_PENDING_PAYMENT')
    .map(v => ({ v, d: daysSince(v.purchase_date || statusSince(v)) }))
    .filter(x => x.d >= lim).sort((a, b) => b.d - a.d);
}

const ACTS = {
  veh_add: ['إضافة سيارة', 'Vehicle added', '#2563eb'], veh_edit: ['تعديل سيارة', 'Vehicle edited', '#475569'], veh_del: ['حذف سيارة', 'Vehicle deleted', '#dc2626'],
  veh_status: ['تغيير مرحلة', 'Stage changed', '#0891b2'], bulk: ['تحديث جماعي', 'Bulk update', '#7c3aed'], img: ['صور', 'Photos', '#64748b'],
  pay_add: ['تسجيل دفعة', 'Payment added', '#059669'], pay_del: ['حذف دفعة', 'Payment deleted', '#dc2626'],
  cust_add: ['إضافة زبون', 'Customer added', '#2563eb'], cust_edit: ['تعديل زبون', 'Customer edited', '#475569'], cust_del: ['حذف زبون', 'Customer deleted', '#dc2626'],
  exp_add: ['مصروف', 'Expense added', '#ea580c'], exp_del: ['حذف مصروف', 'Expense deleted', '#dc2626'], settings: ['الإعدادات', 'Settings', '#64748b'], wa: ['رسالة واتساب', 'WhatsApp sent', '#16a34a']
};
function logAct(act, details, ref) { DB.add('logs', { at: now(), user: S.user?.email || '', act, details: details || '', ref: ref || '' }).catch(() => { }); }
const EXP_CATS = [['rent', 'إيجار', 'Rent'], ['salaries', 'رواتب', 'Salaries'], ['utilities', 'كهرباء ومياه', 'Utilities'], ['telecom', 'إنترنت واتصالات', 'Internet & phone'], ['transport', 'مواصلات ووقود', 'Transport & fuel'], ['hospitality', 'ضيافة', 'Hospitality'], ['ads', 'إعلانات', 'Advertising'], ['other', 'أخرى', 'Other']];
const expCat = k => { const c = EXP_CATS.find(x => x[0] === k); return c ? L(c[1], c[2]) : (k || '—'); };
const normPhone = p => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); if (d.startsWith('0')) d = '218' + d.slice(1); else if (d.length === 9 && d.startsWith('9')) d = '218' + d; return d; };
const fdt = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const totalExp = list => list.reduce((s, e) => s + num(e.amount_usd), 0);

/* ---------------- الهيكل والتنقل ---------------- */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, p] = h.split('/');
  S.route = r || 'dashboard'; S.param = p ? decodeURIComponent(p) : null;
}
function shell(body) {
  const act = { vehicle: 'vehicles', customer: 'customers' }[S.route] || S.route;
  const late = lateList().length;
  const nav = [['dashboard', '📊', L('لوحة التحكم', 'Dashboard'), late], ['vehicles', '🚗', L('السيارات', 'Vehicles')], ['customers', '👥', L('الزبائن', 'Customers')], ['payments', '💵', L('الدفعات', 'Payments')], ['collect', '📞', L('التحصيل', 'Collections'), collectList().filter(x => x.age >= 30).length], ['expenses', '🧾', L('المصاريف', 'Expenses')], ['logs', '🕘', L('سجل العمليات', 'Activity log')], ['settings', '⚙️', L('الإعدادات', 'Settings')]];
  const bn = [['dashboard', '🏠', L('الرئيسية', 'Home'), late], ['vehicles', '🚗', L('السيارات', 'Vehicles')], ['customers', '👥', L('الزبائن', 'Customers')], ['collect', '📞', L('التحصيل', 'Collect'), nav[4][3]]];
  const inMore = ['payments', 'expenses', 'logs', 'settings'].includes(act);
  return `<header class="mtop"><div class="lg">🚢</div><b>${esc(S.settings.office)}</b><button onclick="A.lang()">${L('EN', 'ع')}</button></header>
  <nav class="bnav">${bn.map(n => `<a href="#/${n[0]}" class="${act === n[0] ? 'on' : ''}"><i>${n[1]}</i>${n[2]}${n[3] ? `<span class="dotc">${n[3]}</span>` : ''}</a>`).join('')}
    <a href="javascript:A.more()" class="${inMore ? 'on' : ''}"><i>☰</i>${L('المزيد', 'More')}</a></nav>
  <button class="fab" onclick="A.quick()" aria-label="${L('إضافة', 'Add')}">+</button>
  <div class="layout">
  <aside class="side">
    <div class="brand"><div class="lg">🚢</div><span>${esc(S.settings.office)}</span></div>
    <nav class="nav">${nav.map(n => `<a href="#/${n[0]}" class="${act === n[0] ? 'on' : ''}">${n[1]} <span>${n[2]}</span>${n[3] ? `<b class="cnt">${n[3]}</b>` : ''}</a>`).join('')}
    <a href="#/track" target="_blank">🔎 <span>${L('صفحة التتبع', 'Tracking page')}</span></a></nav>
    <div class="side-foot"><span class="em">${esc(S.user?.email || '')}</span>
      <button onclick="A.lang()">${L('English', 'العربية')}</button>
      ${LOCAL ? '' : `<button onclick="A.logout()">${L('تسجيل الخروج', 'Sign out')}</button>`}</div>
  </aside>
  <main class="main">
    ${LOCAL ? `<div class="banner"><span>⚠️ ${L('وضع تجريبي: البيانات محفوظة في هذا المتصفح فقط. أضف إعدادات Firebase داخل الملف للتشغيل الفعلي.', 'Demo mode: data is saved in this browser only. Add your Firebase config in the file to go live.')}</span></div>` : ''}
    ${body}
  </main></div>`;
}
function render() {
  if (!S.user) return;
  const ae = document.activeElement, fid = ae && ae.id;
  let sel = null; try { if (fid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { }
  const V = { vehicles: vVehicles, vehicle: vVehicle, customers: vCustomers, customer: vCustomer, payments: vPayments, collect: vCollect, expenses: vExpenses, logs: vLogs, settings: vSettings }[S.route] || vDashboard;
  $('#app').innerHTML = shell(V());
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(...sel); } catch (e) { } } }
  if (S.after) { const f = S.after; S.after = null; f(); }
}
function rerender() { applyDir(); if (isPublic()) renderPublic(); else if (S.user) render(); else renderLogin(); }

/* ---------------- لوحة التحكم ---------------- */
function vDashboard() {
  const V = S.vehicles, late = lateList();
  const debts = S.customers.reduce((s, c) => s + Math.max(0, cAgg(c.id).bal), 0);
  const cards = [
    [L('السيارات النشطة', 'Active vehicles'), V.filter(v => v.status !== 'DELIVERED').length, '🚗', '#2563eb'],
    [L('في البحر', 'At sea'), cnt('LOADED_SHIPPED'), '🚢', '#0891b2'],
    [L('وصلت الميناء المحلي', 'At local port'), cnt('ARRIVED_LOCAL_PORT'), '⚓', '#059669'],
    [L('الأرباح والعمولات', 'Profit & commissions'), money(V.reduce((s, v) => s + profit(v), 0)), '💰', '#f97316'],
    [L('صافي الربح (بعد المصاريف)', 'Net profit (after expenses)'), money(V.reduce((s, v) => s + profit(v), 0) - totalExp(S.expenses)), '📈', '#16a34a'],
    [L('ديون على الزبائن', 'Customer debts'), money(debts), '⚠️', '#dc2626'],
    [L('فلوس المكتب عند الزبائن (سلف)', 'Office advances outstanding'), money(V.reduce((s, v) => s + advOut(v), 0)), '💸', '#ea580c']
  ];
  const adv = advList();
  const debtors = S.customers.map(c => ({ c, b: cAgg(c.id).bal })).filter(x => x.b > 0.009).sort((a, b) => b.b - a.b).slice(0, 6);
  const recent = [...V].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')).slice(0, 6);
  return `<div class="top"><h1>${L('لوحة التحكم', 'Dashboard')}</h1>
    <div class="acts"><button class="btn pri" onclick="A.vForm()">+ ${L('سيارة جديدة', 'New vehicle')}</button><button class="btn" onclick="A.pForm()">+ ${L('دفعة', 'Payment')}</button><button class="btn" onclick="A.cForm()">+ ${L('زبون', 'Customer')}</button><button class="btn" onclick="A.seed()" title="${L('تعبئة بيانات تجريبية', 'Load sample data')}">🧪 ${L('بيانات تجريبية', 'Sample data')}</button></div></div>
  ${late.length ? `<div class="alert"><div class="alert-h">🔴 ${L('تنبيه غرامات التأخير', 'Late fee alert')} — ${late.length} ${L('سيارة لم تُسدَّد للمزاد بعد مرور', 'vehicle(s) still unpaid after')} ${num(S.settings.lateDays) || 2} ${L('يوم أو أكثر (خطر Late / Storage fees)', 'days or more (late/storage fee risk)')}</div>

async function loadTrk(vin, force) {
  if (!vin) return;
  if (!force && S.trk[vin] !== undefined) return renderGallery(vin);
  try { S.trk[vin] = (await DB.get('tracking', vin)) || { images: [] }; } catch (e) { S.trk[vin] = { images: [] }; }
  renderGallery(vin);
}
function galGrid(imgs, admin, vin) {

function renderGallery(vin) {
  const el = $('#gal'); if (!el) return;
  const all = ((S.trk[vin] || {}).images || []).map((x, i) => ({ ...x, i }));
  S.lbList = all.map(x => x.src);

  el.innerHTML = `<div class="tabs"><button class="tab ${tab === 'all' ? 'on' : ''}" onclick="A.gTab('all','${esc(vin)}')">${L('الكل', 'All')} (${all.length})</button>

    ${galGrid(imgs, true, vin)}
    <div class="addimg"><select id="imgStage">${STAGES.map(s => `<option value="${s.k}" ${tab === s.k ? 'selected' : ''}>${esc(L(s.ar, s.en))}</option>`).join('')}</select>
      <input id="imgUrl" placeholder="${L('رابط صورة (https://...)', 'Image URL (https://...)')}" dir="ltr">
      <button class="btn" onclick="A.imgUrl('${esc(vin)}')">${L('إضافة رابط', 'Add URL')}</button>
      <label class="btn pri fileb">⬆️ ${L('رفع صور', 'Upload')}<input type="file" accept="image/*" multiple onchange="A.imgFiles('${esc(vin)}',this)"></label></div>
    <div class="hint">${L('الصور المرفوعة تُضغط تلقائياً وتُحفظ مع بيانات التتبع (يفضّل حتى ~8 صور مرفوعة لكل سيارة، والروابط بلا حد تقريباً).', 'Uploaded photos are compressed and stored with tracking data (~8 uploads per car recommended; URLs are almost unlimited).')}</div>`;
}
function compress(file, max = 1000, q = 0.62) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => { let { width: w, height: h } = im; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function pushImages(vin, list) {
  const v = S.vehicles.find(x => x.vin === vin); if (!v) return;
  const all = [...((S.trk[vin] || {}).images || []), ...list];
  if (JSON.stringify(all).length > 950000) return toast(L('تجاوزت الحد المسموح لحجم الصور لهذه السيارة — احذف بعض الصور أو استخدم روابط.', 'Photo storage limit reached for this car — remove some or use URLs.'), 'err');
  await syncTracking(v, { images: all });
  S.trk[vin] = { ...(S.trk[vin] || {}), images: all };
  renderGallery(vin); logAct('img', `+${list.length} · ${vt(v)} · ${vin}`, 'v:' + v.id); toast(L('تمت إضافة الصور', 'Photos added'));
}
async function syncTracking(v, extra = {}) {
  if (!v.vin) return;
  await DB.merge('tracking', v.vin, {
    vin: v.vin, make: v.make || '', model: v.model || '', year: v.year || '', color: v.color || '', trim: v.trim || '', engine: v.engine || '', status: v.status,
    status_history: v.status_history || [], container_number: v.container_number || '', auction_name: v.auction_name || '', updated_at: now(), ...extra
  });
}

/* ---------------- التحصيل ---------------- */
function collectList() {
  return S.customers.map(c => {
    const a = cAgg(c.id); if (a.bal <= 0.009) return null;
    const open = S.vehicles.filter(v => v.customer_id === c.id && vBal(v) > 0.009);
    const oldest = open.reduce((m, v) => { const d = v.purchase_date || (v.created_at || '').slice(0, 10); return d && (!m || d < m) ? d : m; }, '');
    const lp = S.payments.filter(p => p.customer_id === c.id).reduce((m, p) => (p.date || '') > m ? p.date : m, '');
    return { c, bal: a.bal, open, age: oldest ? daysSince(oldest) : 0, lp, adv: open.reduce((s, v) => s + advOut(v), 0) };
  }).filter(Boolean);
}

/* ---------------- الإجراءات ---------------- */
const A = {
  close() { $('#modal').innerHTML = ''; },
  lang() { S.lang = S.lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('cop_lang', S.lang); rerender(); },
  async login(e) { e.preventDefault(); try { await DB.login($('#le').value.trim(), $('#lp').value); } catch (x) { renderLogin(L('البريد أو كلمة المرور غير صحيحة', 'Invalid email or password')); } },
  async logout() { await DB.logout(); },
  goStatus(k) { S.f = { q: '', status: k, auction: '', cust: '' }; location.hash = '#/vehicles'; },
  fq(v) { S.f.q = v; const el = $('#vlist'); if (el) el.innerHTML = vListInner(); },
  ff(k, v) { if (k) S.f[k] = v; const el = $('#vlist'); if (el) el.innerHTML = vListInner(); },
  cqf(v) { S.cq = v; const el = $('#clist'); if (el) el.innerHTML = cListInner(); },
  pff(k, v) { S.pf[k] = v; render(); },

  /* السيارات */
  vForm(id, cid) {
    if (!S.customers.length) return openModal(`<h2>${L('أضف زبوناً أولاً', 'Add a customer first')}</h2><p>${L('يجب ربط كل سيارة بزبون.', 'Every vehicle must belong to a customer.')}</p><div class="mfoot"><button class="btn pri" onclick="A.cForm()">+ ${L('زبون جديد', 'New customer')}</button></div>`, 'sm');
    openModal(vFormHtml(id ? S.vehicles.find(v => v.id === id) || {} : {}, cid));
  },
  calc() {
    const fd = new FormData($('#vf'));
    $('#vtot').textContent = money(FIN.reduce((s, x) => s + num(fd.get('fin_' + x.k)), 0));
  },
  async vSave(e, id) {
    e.preventDefault();
    const fd = new FormData(e.target), g = k => (fd.get(k) || '').toString().trim();
    const vin = g('vin').toUpperCase().replace(/\s/g, '');
    if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return toast(L('رقم الهيكل يجب أن يكون 17 خانة (أحرف وأرقام بدون I و O و Q)', 'VIN must be 17 characters (no I, O, Q)'), 'err');
    if (S.vehicles.some(v => v.vin === vin && v.id !== id)) return toast(L('رقم الهيكل مسجّل مسبقاً لسيارة أخرى', 'This VIN already exists'), 'err');
    const old = id ? S.vehicles.find(v => v.id === id) : null;
    const fin = {}; FIN.forEach(x => { const val = g('fin_' + x.k); fin[x.k] = val === '' ? 0 : r2(num(val)); });
    fin.shipping_cost_actual = g('fin_shipping_cost_actual') === '' ? 0 : r2(num(g('fin_shipping_cost_actual')));
    const status = g('status');
    const data = {
      customer_id: g('customer_id'), vin, lot_number: g('lot_number'), make: g('make'), model: g('model'), year: g('year'), color: g('color'), trim: g('trim'), engine: g('engine'),
      auction_name: g('auction_name'), auction_location: g('auction_location'),
      container_number: g('container_number'), booking_number: g('booking_number'), status, purchase_date: g('purchase_date'), auction_paid_by: g('auction_paid_by'), auction_paid_date: g('auction_paid_by') ? (g('auction_paid_date') || today()) : '', notes: g('notes'), fin, total_cost: r2(FIN.reduce((s, x) => s + fin[x.k], 0))
    };
    try {
      let vid = id;
      if (old) {
        data.status_history = [...(old.status_history || [])];
        if (old.status !== status) data.status_history.push({ status, at: now() });
        await DB.update('vehicles', id, data);
        logAct(old.status !== status ? 'veh_status' : 'veh_edit', `${vt(data)} · ${vin}${old.status !== status ? ' → ' + stName(status) : ''}`, 'v:' + id);
        if (old.vin !== vin) {
          const t = await DB.get('tracking', old.vin).catch(() => null);
          await syncTracking({ ...old, ...data }, { images: (t && t.images) || [] });
          await DB.del('tracking', old.vin).catch(() => { });
          delete S.trk[old.vin]; delete S.trk[vin];
        } else await syncTracking({ ...old, ...data });
      } else {
        data.status_history = [{ status, at: now() }]; data.created_at = now();
        vid = await DB.add('vehicles', data);
        logAct('veh_add', `${vt(data)} · ${vin} · ${custName(data.customer_id)}`, 'v:' + vid);
        await syncTracking(data);
      }
      A.close(); toast(L('تم الحفظ', 'Saved'));
      if (!old) location.hash = '#/vehicle/' + vid;
    } catch (x) { toast(x.message, 'err'); }
  },
  async setStatus(id, k) {
    const v = S.vehicles.find(x => x.id === id); if (!v || v.status === k) return;
    const h = [...(v.status_history || []), { status: k, at: now() }];

  /* رقم الهيكل */
  vinIn(el) {
    el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const m = $('#vinMsg'); if (m) { m.className = 'vmsg'; m.textContent = el.value.length < 17 ? `${el.value.length} / 17` : ''; }
    if (el.value.length === 17) A.vinDecode(false);
  },
  async vinDecode(force) {
    const f = $('#vf'), vin = (f.vin.value || '').trim(), m = $('#vinMsg');
    if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) { m.className = 'vmsg bad'; m.textContent = L('رقم الهيكل غير صحيح (17 خانة بدون I و O و Q)', 'Invalid VIN (17 chars, no I/O/Q)'); return; }
    if (S.vehicles.some(v => v.vin === vin && v.id !== (f.dataset.id || ''))) { m.className = 'vmsg bad'; m.textContent = '⚠️ ' + L('رقم الهيكل هذا مسجّل لسيارة أخرى', 'This VIN is already registered'); return; }
    m.className = 'vmsg'; m.textContent = L('جاري جلب بيانات السيارة...', 'Looking up vehicle...');
    try {
      const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);
      const d = ((await r.json()).Results || [])[0] || {};
      const tc = x => (x || '').trim().split(/([ -])/).map(w => w.length > 3 || /[a-z]/.test(w) ? w.charAt(0) + w.slice(1).toLowerCase() : w).join('');
      const make = tc(d.Make), model = (d.Model || '').trim(), year = (d.ModelYear || '').trim();
      if (!make && !model) { m.className = 'vmsg bad'; m.textContent = L('ما لقيناش بيانات لهذا الرقم — عبّيها يدوياً', 'No data found — fill in manually'); return; }
      if (make && (force || !f.make.value)) f.make.value = make;
      if (model && (force || !f.model.value)) f.model.value = model;
      if (year && (force || !f.year.value)) f.year.value = year;
      const trim = [d.Trim, d.Series].map(x => (x || '').trim()).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(' ');
      const cfg = { 'V-Shaped': 'V', 'In-Line': 'L', 'Horizontally opposed (boxer)': 'H', 'W-Shaped': 'W' }[(d.EngineConfiguration || '').trim()] || '';
      const cyl = (d.EngineCylinders || '').trim(), dl = num(d.DisplacementL), fuel = (d.FuelTypePrimary || '').trim();
      let engine = [cyl ? (cfg ? cfg + cyl : cyl + ' cyl') : '', dl ? (Math.round(dl * 10) / 10).toFixed(1) + 'L' : ''].filter(Boolean).join(' ');
      if (!engine && /electric/i.test(fuel)) engine = 'Electric';
      else if (engine && /hybrid/i.test((d.ElectrificationLevel || '') + fuel)) engine += ' Hybrid';
      if (trim && (force || !f.trim.value)) f.trim.value = trim;
      if (engine && (force || !f.engine.value)) f.engine.value = engine;
      m.className = 'vmsg ok'; m.textContent = `✅ ${year} ${make} ${model} ${trim} ${engine ? '· ' + engine : ''}`.replace(/\s+/g, ' ');
    } catch (e) { m.className = 'vmsg bad'; m.textContent = L('تعذّر الاتصال — عبّي البيانات يدوياً', 'Lookup failed — fill in manually'); }
  },

    const mk = (cid, vin, lot, make, model, year, color, st, days, fin, extra = {}) => {
      const i = stIdx(st), h = ST.slice(0, i + 1).map((s, j) => ({ status: s.k, at: d(days - j * Math.max(1, Math.floor(days / (i + 1)))) }));
      return { customer_id: cid, vin, lot_number: lot, make, model, year, color, auction_name: 'Copart', auction_location: 'TX - Houston', container_number: i >= 4 ? 'MSCU' + Math.floor(1e6 + Math.random() * 9e6) : '', booking_number: i >= 3 ? 'BK' + lot.slice(-5) : '', status: st, status_history: h, purchase_date: d(days).slice(0, 10), notes: '', fin, total_cost: FIN.reduce((s, x) => s + num(fin[x.k]), 0), created_at: d(days), ...extra };
    };
    const F = (b, af, inl, oc, cc, oc2, tc, act) => ({ bid_price: b, auction_fees: af, inland_shipping: inl, ocean_shipping: oc, office_commission: oc2, transfer_commission: tc, other_fees: 0, shipping_cost_actual: act });
    const list = [
      mk(c1, '1HGCM82633A004352', '45129873', 'Honda', 'Accord', 2021, 'أبيض', 'WON_PENDING_PAYMENT', 4, F(6200, 780, 0, 0, 0, 300, 60, 0)),
      mk(c1, '5YJ3E1EA7KF317000', '51230981', 'Tesla', 'Model 3', 2019, 'أسود', 'LOADED_SHIPPED', 25, F(9800, 950, 450, 1350, 600, 350, 90, 1550), { trim: 'Long Range', engine: 'Electric', auction_paid_by: 'office', auction_paid_date: d(24).slice(0, 10) }),
      mk(c2, '1FTFW1ET5DFC10312', '39812004', 'Ford', 'F-150', 2018, 'رمادي', 'ARRIVED_LOCAL_PORT', 50, F(11500, 1100, 600, 1600, 800, 400, 110, 1900)),
      mk(c2, '2T1BURHE0JC074843', '48100273', 'Toyota', 'Corolla', 2018, 'فضي', 'INLAND_TRANSIT', 9, F(4300, 650, 380, 1250, 500, 250, 45, 1400), { trim: 'LE', engine: 'L4 1.8L', auction_paid_by: 'office', auction_paid_date: d(8).slice(0, 10) }),
      mk(c3, 'KMHD84LF5HU123456', '50011234', 'Hyundai', 'Elantra', 2017, 'أحمر', 'DELIVERED', 70, F(3900, 600, 350, 1250, 500, 250, 40, 1350))
    ];
    const ids = []; for (const v of list) { ids.push(await add('vehicles', v)); await syncTracking(v); }
    await add('payments', { customer_id: c1, vehicle_id: ids[1], amount: 12000, currency: 'USD', rate: 1, amount_usd: 12000, date: d(24).slice(0, 10), receipt_notes: 'دفعة أولى' });
    await add('payments', { customer_id: c2, vehicle_id: ids[2], amount: 70000, currency: 'LYD', rate: 7, amount_usd: 10000, date: d(45).slice(0, 10), receipt_notes: 'نقداً بالمكتب' });
    await add('payments', { customer_id: c3, vehicle_id: ids[4], amount: 6890, currency: 'USD', rate: 1, amount_usd: 6890, date: d(60).slice(0, 10), receipt_notes: 'سداد كامل' });
    for (const [cat, amt, n] of [['rent', 2500, 20], ['salaries', 4000, 18], ['utilities', 350, 10], ['hospitality', 150, 3]]) await add('expenses', { category: cat, amount: amt, currency: 'LYD', rate: 7, amount_usd: r2(amt / 7), date: d(n).slice(0, 10), notes: '' });
    toast(L('تمت إضافة بيانات تجريبية', 'Sample data loaded'));
  },
  async unseed(silent) {
    if (!silent) DB.refresh();
    const vs = S.vehicles.filter(v => v.demo), cs = S.customers.filter(c => c.demo), ps = S.payments.filter(p => p.demo), es = S.expenses.filter(e => e.demo);
    if (!vs.length && !cs.length && !ps.length && !es.length) return silent ? null : toast(L('لا توجد بيانات تجريبية', 'No sample data found'), 'err');
    if (!silent && !confirm(L(`حذف البيانات التجريبية فقط (${cs.length} زبائن، ${vs.length} سيارات، ${ps.length} دفعات)؟ بياناتك الحقيقية ما تتأثرش.`, `Delete sample data only (${cs.length} customers, ${vs.length} vehicles, ${ps.length} payments)? Your real data is untouched.`))) return;
    try {
      for (const p of ps) await DB.del('payments', p.id);
      for (const e of es) await DB.del('expenses', e.id);
      for (const v of vs) { await DB.del('tracking', v.vin).catch(() => { }); delete S.trk[v.vin]; await DB.del('vehicles', v.id); }
      for (const c of cs) await DB.del('customers', c.id);
      if (!silent) toast(L('تم حذف البيانات التجريبية', 'Sample data deleted'));
    } catch (x) { toast(x.message, 'err'); }
  }
};
window.A = A; window.$ = $;

/* ---------------- التشغيل ---------------- */
let unsubs = [];
function startWatch() {
  if (unsubs.length) return;
  DB.get('settings', 'main').then(d => { if (d) { S.settings = { ...S.settings, ...d }; render(); } }).catch(() => { });
  ['customers', 'vehicles', 'payments', 'expenses'].forEach(c => unsubs.push(DB.watch(c, arr => { S[c] = arr; S.loaded[c] = true; recompute(); render(); })));
  unsubs.push(DB.watch('logs', arr => { S.logs = arr; if (S.route === 'logs') render(); }, { order: 'at', limit: 300 }));
}
function stopWatch() { unsubs.forEach(u => u && u()); unsubs = []; }

window.addEventListener('hashchange', () => { parseRoute(); A.close(); if (isPublic()) renderPublic(); else if (S.user) { startWatch(); render(); window.scrollTo(0, 0); } else renderLogin(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') A.close(); });

function setupPWA() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, '#f97316'); g.addColorStop(1, '#fb923c');
    x.fillStyle = '#0f172a'; x.fillRect(0, 0, 512, 512); x.fillStyle = g;
    x.beginPath(); x.roundRect ? x.roundRect(76, 76, 360, 360, 90) : x.rect(76, 76, 360, 360); x.fill();
    x.font = '230px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🚢', 256, 270);
    const icon = c.toDataURL('image/png');
    const add = (rel, href, extra = {}) => { const l = document.createElement('link'); l.rel = rel; l.href = href; Object.assign(l, extra); document.head.appendChild(l); };
    add('icon', icon); add('apple-touch-icon', icon);
    const base = location.origin + location.pathname;
    const man = { name: S.settings.office || 'AWS لاستيراد السيارات', short_name: 'AWS', start_url: base, scope: base, display: 'standalone', background_color: '#0f172a', theme_color: '#0f172a', dir: 'rtl', lang: 'ar', icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    if (location.protocol.startsWith('http')) add('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
  } catch (e) { }
}

(async function boot() {
  setupPWA();
  applyDir(); parseRoute();
  $('#app').innerHTML = `<div class="login"><div class="logo">🚢</div></div>`;
  try { await DB.init(); }
  catch (e) { $('#app').innerHTML = `<div class="login"><div class="card lcard"><h2>⚠️</h2><p>${L('تعذّر الاتصال بـ Firebase. تحقق من الإنترنت ومن إعدادات المشروع.', 'Could not connect to Firebase. Check your connection and config.')}</p><div class="err">${esc(e.message)}</div></div></div>`; return; }
  if (isPublic()) { renderPublic(); }
  DB.onAuth(u => {
    S.user = u;
    if (isPublic()) return;
    if (u) { startWatch(); render(); } else { stopWatch(); S.customers = []; S.vehicles = []; S.payments = []; renderLogin(); }
  });
})();
</script>
