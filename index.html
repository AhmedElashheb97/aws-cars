<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="السيارات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>تسجيل السيارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#0B1320;
    --card:#1E293B;
    --ink:#F1F5F9;
    --muted:#94A3B8;
    --line:#2E3B52;
    --line-strong:#44546E;
    --green:#10B981;
    --green-dim:rgba(16,185,129,.16);
    --rust:#F87171;
    --rust-dim:rgba(248,113,113,.16);
    --navy:#6366F1;
    --navy-dim:rgba(99,102,241,.18);
  }
  :root[data-theme="light"]{
    --paper:#F2F0E8;
    --card:#FFFFFF;
    --ink:#1E2430;
    --muted:#6B7280;
    --line:#E2DFD2;
    --line-strong:#CBC5B2;
    --green:#0E9F6E;
    --green-dim:rgba(14,159,110,.12);
    --rust:#DC4C3E;
    --rust-dim:rgba(220,76,62,.12);
    --navy:#4F46E5;
    --navy-dim:rgba(79,70,229,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{transition:background-color .2s ease, color .2s ease;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    font-variant-numeric:tabular-nums;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:36px;}

  /* header */
  .topbar{
    background:var(--navy);color:#fff;padding:16px 18px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
  }
  .topbar .tbtn{
    background:rgba(255,255,255,.12);border:none;color:#fff;width:40px;height:40px;
    border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .topbar .tbtn.refreshing svg{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .topbar h1{font-family:'Almarai';font-weight:800;font-size:19px;margin:0;flex:1;}
  .topbar .sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;}

  .main{padding:16px;}

  /* icons */
  svg.ic{width:24px;height:24px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  /* ---- home stats ---- */
  .stats-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
  .stat-tile{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 6px;text-align:center;}
  .stat-tile .n{font-family:'Almarai';font-weight:800;font-size:20px;color:var(--green);}
  .stat-tile .l{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35;}

  /* ---- menu list (used for sub-menus like data view / transfers) ---- */
  .menu-list{display:flex;flex-direction:column;gap:10px;}
  .menu-item{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  }
  .menu-item .ic-wrap{
    width:44px;height:44px;border-radius:10px;background:var(--navy-dim);color:var(--navy);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .menu-item .txt{font-family:'Almarai';font-weight:700;font-size:16px;flex:1;}
  .menu-item .arrow{color:var(--muted);font-size:20px;}

  /* ---- search / toolbar ---- */
  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .search-box{
    flex:1;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);
  }
  .search-box input{border:none;background:none;outline:none;flex:1;font-family:'Cairo';font-size:13.5px;color:var(--ink);}
  .sq-btn{
    background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;
    display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;flex-shrink:0;
  }

  /* ---- segmented filter ---- */
  .segmented{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px;}
  .segmented button{
    flex:1;border:none;background:none;padding:8px;font-family:'Cairo';font-weight:600;font-size:12.5px;
    color:var(--muted);border-radius:8px;cursor:pointer;
  }
  .segmented button.active{background:var(--navy);color:#fff;}

  /* ---- ledger rows (car list) ---- */
  .ledger-row{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;cursor:pointer;
    display:flex;align-items:center;gap:12px;
  }
  .ledger-row .thumb{
    width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;
    background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);
  }
  .ledger-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .ledger-row .row-body{flex:1;min-width:0;}
  .ledger-row .top{display:flex;align-items:center;gap:6px;}
  .ledger-row .name{font-family:'Almarai';font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ledger-row .dots{flex:1;min-width:10px;}
  .ledger-row .val{font-family:'Almarai';font-weight:800;font-size:15px;color:var(--green);white-space:nowrap;}
  .ledger-row .meta{display:flex;justify-content:space-between;margin-top:7px;}
  .ledger-row .meta span{font-size:12px;color:var(--muted);}
  .badge{
    font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;
  }
  .badge.sold{background:rgba(148,163,184,.16);color:var(--muted);}
  .badge.unsold{background:var(--green-dim);color:var(--green);}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty svg{width:36px;height:36px;margin-bottom:12px;opacity:.5;}
  .empty h3{font-family:'Almarai';font-size:15.5px;color:var(--ink);margin:0 0 6px;}
  .empty p{font-size:13px;line-height:1.7;margin:0;}

  /* fab */
  .fab{
    position:fixed;bottom:88px;inset-inline-end:calc(50% - 240px + 20px);
    width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;
    font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 6px 18px rgba(99,102,241,.4);z-index:20;
  }
  @media (max-width:520px){.fab{inset-inline-end:20px;}}

  /* ---- forms ---- */
  .section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;}
  .section h4{font-family:'Almarai';font-size:12.5px;color:var(--navy);margin:0 0 12px;display:flex;align-items:center;gap:6px;}
  .section h4::before{content:'';width:5px;height:5px;background:var(--navy);border-radius:1px;}

  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;}
  .field{margin-bottom:12px;}
  input[type=text],input[type=number],input[type=date],input[type=url],textarea{
    width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:12px 13px;color:var(--ink);font-size:15.5px;font-family:'Cairo';
  }
  textarea{resize:vertical;min-height:70px;font-family:'Cairo';}
  input:focus,textarea:focus{outline:none;border-color:var(--navy);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}

  .img-upload{
    border:1.5px dashed var(--line-strong);border-radius:10px;padding:12px;text-align:center;
    color:var(--muted);font-size:12.5px;position:relative;margin-bottom:12px;background:var(--paper);
  }
  .img-upload img{max-width:100%;max-height:140px;border-radius:8px;margin-bottom:8px;}
  .img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .img-upload .lbl-btn{
    display:inline-block;background:var(--navy);color:#fff;padding:6px 14px;border-radius:8px;
    font-size:12px;font-weight:600;position:relative;z-index:1;pointer-events:none;
  }

  .conv-trail{
    display:flex;align-items:center;justify-content:center;gap:7px;background:var(--paper);
    border-radius:8px;padding:9px;margin-top:2px;font-size:12.5px;color:var(--muted);
  }
  .conv-trail b{color:var(--green);}
  .conv-trail .op{color:var(--line-strong);}

  .exp-row{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .exp-row .exp-label{flex:1;font-size:13px;}
  .exp-row .exp-amt{font-weight:700;font-size:13px;color:var(--navy);white-space:nowrap;}
  .exp-row .del{background:none;border:none;color:var(--rust);font-size:15px;cursor:pointer;padding:2px 4px;}
  .exp-empty{color:var(--muted);font-size:12px;text-align:center;padding:6px 0;}
  .add-exp{display:flex;gap:8px;}
  .add-exp #expLabelInput{flex:2;min-width:0;}
  .add-exp #expAmountInput{flex:0.9;min-width:0;}
  .add-exp #contribNameInput{flex:2;min-width:0;}
  .add-exp #contribAmountInput{flex:0.9;min-width:0;}
  .add-exp button{background:var(--green);border:none;color:#fff;border-radius:8px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
  .switch{width:42px;height:24px;background:var(--line);border-radius:20px;position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--green);}
  .switch .dot{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s;}
  .switch.on .dot{left:20px;}

  .save-bar{display:flex;gap:10px;margin-top:4px;}
  .btn{flex:1;border:none;border-radius:10px;padding:16px;font-family:'Almarai';font-weight:800;font-size:16px;cursor:pointer;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);}
  .btn.danger{background:var(--rust-dim);color:var(--rust);}

  /* ---- total display screen ---- */
  .total-box{
    background:var(--card);border:2px solid var(--navy);border-radius:14px;padding:28px 18px;text-align:center;margin-top:10px;
  }
  .total-box .cap{font-size:12px;color:var(--muted);letter-spacing:.4px;}
  .total-box .num{font-family:'Almarai';font-weight:800;font-size:30px;color:var(--navy);margin:10px 0 4px;border-top:2px double var(--line-strong);border-bottom:2px double var(--line-strong);padding:10px 0;}
  .total-box .unit{font-size:11.5px;color:var(--muted);}
  .stat-row{display:flex;justify-content:space-around;margin-top:16px;}
  .stat-row div{text-align:center;}
  .stat-row b{display:block;font-family:'Almarai';font-size:14px;color:var(--ink);}
  .stat-row span{font-size:10.5px;color:var(--muted);}

  /* ---- read-only detail ---- */
  .kv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--muted);}
  .kv-row .v{font-weight:700;color:var(--ink);}
  .kv-row .v.pos{color:var(--green);}
  .kv-row .v.neg{color:var(--rust);}

  /* ---- transfer ledger ---- */
  .tx-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;}
  .tx-row .note{font-size:13px;}
  .tx-row .date{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .tx-row .amt{font-family:'Almarai';font-weight:800;font-size:14px;}
  .tx-row .amt.pos{color:var(--green);}
  .tx-row .amt.neg{color:var(--rust);}
  .tx-row .del{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;margin-inline-start:8px;}

  .add-tx{display:flex;gap:8px;margin-bottom:14px;}
  .amt-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0;}
  .amt-toggle button{width:34px;background:var(--paper);border:none;font-size:16px;font-weight:700;cursor:pointer;color:var(--muted);}
  .amt-toggle button.active-plus{background:var(--green-dim);color:var(--green);}
  .amt-toggle button.active-minus{background:var(--rust-dim);color:var(--rust);}
  .sign-toggle{display:flex;gap:8px;margin-bottom:10px;}
  .sign-toggle button{
    flex:1;padding:13px 6px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);
    font-family:'Cairo';font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;line-height:1.4;
  }
  .sign-toggle button.active-plus{background:var(--green-dim);color:var(--green);border-color:var(--green);}
  .sign-toggle button.active-minus{background:var(--rust-dim);color:var(--rust);border-color:var(--rust);}
  .add-tx input{flex:1;}
  .add-tx .go{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;}
  .add-person{display:flex;gap:8px;margin-bottom:14px;}
  .add-person input{flex:1;}
  .add-person button{background:var(--green);border:none;color:#fff;border-radius:8px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;}
  .cf-block{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);}
  .cf-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .cf-block input.cf-label{
    font-family:'Almarai';font-weight:800;font-size:17px;border:none;border-bottom:2px solid var(--line-strong);
    background:none;padding:6px 2px;width:100%;color:var(--navy);
  }
  .cf-block input.cf-label:focus{outline:none;border-color:var(--navy);}
  .cf-block input.cf-value{
    font-size:18px;font-weight:700;margin-top:8px;width:100%;background:var(--paper);
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--ink);font-family:'Cairo';
  }
  .cf-block input.cf-value:focus{outline:none;border-color:var(--navy);}

  .loading{text-align:center;padding:80px 20px;color:var(--muted);}
  .err-banner{background:var(--rust-dim);color:var(--rust);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(2,6,14,.72);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal-card{
    background:var(--card);border-radius:14px;padding:20px 18px;max-width:360px;width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .modal-card h4{font-family:'Almarai';font-size:15px;color:var(--navy);margin:0 0 8px;}
  .modal-card p{font-size:13px;color:var(--muted);margin:0;line-height:1.7;}
  .modal-card .save-bar{flex-direction:column;}
  .modal-card .save-bar .btn{width:100%;}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;}
  .login-logo{text-align:center;margin-bottom:26px;}
  .login-logo .mark{width:56px;height:56px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .login-logo h2{font-family:'Almarai';font-weight:800;font-size:18px;margin:0;}
  .login-toggle{display:flex;justify-content:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted);}
  .login-toggle b{color:var(--navy);cursor:pointer;font-weight:700;}

  /* ---- report page ---- */
  .report-page{background:#fff;border:1px solid #e3e0d7;border-radius:12px;padding:20px;color:#1a1a1a;}
  .report-head{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:16px;}
  .report-head h2{font-family:'Almarai';font-weight:800;font-size:18px;margin:0 0 4px;color:var(--navy);}
  .report-head .issued{font-size:11.5px;color:#777;}
  .report-photo{text-align:center;margin-bottom:16px;}
  .report-photo img{max-width:100%;max-height:200px;border-radius:8px;border:1px solid #e3e0d7;}
  .report-section-title{font-family:'Almarai';font-weight:700;font-size:12.5px;color:var(--navy);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid #e3e0d7;}
  .report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dotted #ddd;}
  .report-row .k{color:#666;}
  .report-row .v{font-weight:700;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .report-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  .report-table th,.report-table td{border:1px solid #e3e0d7;padding:7px 8px;text-align:center;}
  .report-table th{background:#F1EFE8;font-family:'Almarai';font-weight:700;color:#1a1a1a;}
  .report-grand{background:var(--navy);color:#fff;border-radius:10px;padding:14px;text-align:center;margin-top:16px;}
  .report-grand .lbl{font-size:11px;opacity:.8;}
  .report-grand .amt{font-family:'Almarai';font-weight:800;font-size:20px;margin-top:4px;}
  .report-mini-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
  .report-mini{background:#F1EFE8;border-radius:8px;padding:10px 6px;text-align:center;}
  .report-mini .lbl{font-size:10px;color:#777;}
  .report-mini .amt{font-family:'Almarai';font-weight:800;font-size:13px;margin-top:4px;color:var(--navy);}
  @media print{
    .no-print,.bottom-nav,.fab{display:none !important;}
    #app.has-nav{padding-bottom:0 !important;padding-inline-start:0 !important;}
    .main{display:block !important;max-width:none !important;padding:0 !important;}
    .topbar,.home-topbar{padding-inline:0 !important;}
    body{background:#fff;}
    #app{max-width:100%;padding-bottom:0;}
    .report-page{border:none;padding:0;}
    .table-scroll{overflow:visible;}
  }

  /* ---- home dashboard ---- */
  #app.has-nav{padding-bottom:88px;}
  .home-topbar{
    background:linear-gradient(135deg,var(--card),var(--paper));color:var(--ink);padding:16px 18px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);
  }
  .home-topbar .avatar{
    width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'Almarai';font-weight:800;font-size:16px;
  }
  .home-topbar .htb-title{flex:1;min-width:0;}
  .home-topbar h1{font-family:'Almarai';font-weight:800;font-size:17px;margin:0;}
  .home-topbar .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .home-topbar .tbtn{background:rgba(255,255,255,.06);color:var(--ink);}

  .quick-actions{display:flex;gap:10px;margin:4px 0 20px;}
  .qa-btn{
    flex:1;border:none;border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;
    gap:7px;font-family:'Almarai';font-weight:800;font-size:13.5px;cursor:pointer;color:#fff;
  }
  .qa-btn svg{width:22px;height:22px;}
  .qa-btn.qa-primary{background:var(--navy);box-shadow:0 8px 18px rgba(99,102,241,.28);}
  .qa-btn.qa-accent{background:var(--green);box-shadow:0 8px 18px rgba(16,185,129,.25);}

  .home-section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
  .home-section-head h3{font-family:'Almarai';font-weight:800;font-size:14.5px;margin:0;color:var(--ink);}
  .home-section-head .link{font-size:12px;color:var(--navy);font-weight:700;cursor:pointer;}

function expensesTotal(c){
  if(Array.isArray(c.expenses)) return c.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  return Number(c.expenses)||0;
}
function carTotal(c){
  const purchaseLYDAmt = c.purchaseCurrency==='lyd' ? (Number(c.purchaseLYD)||0) : (Number(c.purchaseUSD)||0)*(Number(c.purchaseRate)||0);
  return purchaseLYDAmt + (Number(c.shippingUSD)||0)*(Number(c.shippingRate)||0) + expensesTotal(c);
}
function accountBalance(key){
  return (state.data.transfers[key]||[]).reduce((s,t)=>s+Number(t.amount||0),0);
}

function carProfit(c){
  if(!c.sold) return null;
  return (Number(c.sellPrice)||0) - carTotal(c);
}

/* ---------------- PROFIT SHARES (نسب الأرباح) ---------------- */
const DEFAULT_PARTNERS = [{id:'ahmed',name:'أحمد',percent:30},{id:'mohammed',name:'محمد',percent:45},{id:'zakaria',name:'زكريا',percent:25}];
/* أول مرة: السيارات المبيوعة الحالية تتقسم بين أحمد وزكريا (أحمد 32276 والباقي لزكريا)،
   والسيارات الجديدة تتقسم حسب النسب 30/45/25. كل سيارة تحفظ نسبها وقت البيع (profitPercents). */
function ensureProfitShares_(d){
  if(!Array.isArray(d.trash)) d.trash = [];
  if(!Array.isArray(d.activityLog)) d.activityLog = [];
  if(!d.settings || typeof d.settings!=='object') d.settings = {};
  if(d.profitShares && Array.isArray(d.profitShares.partners)) return d;
  const partners = DEFAULT_PARTNERS.map(p=>({...p}));
  const sold = (d.cars||[]).filter(c=>c.sold);
  const legacyTotal = sold.reduce((s,c)=>s+carProfit(c),0);
  const r = legacyTotal>0 ? 32276/legacyTotal : 0;
  if(r>0 && r<1){
    sold.forEach(c=>{ if(!c.profitPercents) c.profitPercents = { ahmed:r*100, mohammed:0, zakaria:(1-r)*100 }; });
  }
  d.profitShares = { partners };
  return d;
}
function partnerDeducted(id){
  const n = state.data.profitShares.partners.length || 1;
  return ((state.data.profitShares.deductions)||[]).reduce((s,d)=>s+Number(d.amount||0)/n,0);
}
function totalDeductions(){
  return ((state.data.profitShares.deductions)||[]).reduce((s,d)=>s+Number(d.amount||0),0);
}
function partnerNet(id,split){ return split[id] - partnerDeducted(id) - partnerWithdrawn(id); }
function partnerWithdrawn(id){
  return ((state.data.profitShares.withdrawals)||[]).filter(w=>w.partnerId===id).reduce((s,w)=>s+Number(w.amount||0),0);
}

/* ---------------- LOG / TRASH / SETTINGS / ALERTS ---------------- */
const EXPENSE_PRESETS = ['شحن','جمرك','تخليص','صيانة','دهان','ميكانيكا','كهرباء','غسيل','أوراق','عمولة','وقود','نقل'];
const TRASH_TYPES = { car:'سيارة', debtPerson:'شخص (ديون)', withdrawal:'سحب من المكسب', deduction:'خصم من المكسب' };
function logAct(text){
  const d = state.data;
  if(!Array.isArray(d.activityLog)) d.activityLog = [];
  const u = (currentUser && currentUser.email) ? currentUser.email.split('@')[0] : '';
  d.activityLog.unshift({ t:new Date().toISOString(), u, text:String(text||'') });
  if(d.activityLog.length>500) d.activityLog.length = 500;
}
function sendToTrash_(type, label, payload, extra){
  const d = state.data;
  if(!Array.isArray(d.trash)) d.trash = [];
  const now = Date.now();
  d.trash = d.trash.filter(x=> now - new Date(x.deletedAt).getTime() < 30*86400000);
  if(type==='car' && payload && payload.image && String(payload.image).length>60000){ payload.image = null; extra = Object.assign({}, extra, {imageDropped:true}); }
  d.trash.unshift({ id:'tr_'+now+'_'+Math.random().toString(36).slice(2,6), type, label, deletedAt:new Date().toISOString(), payload:JSON.parse(JSON.stringify(payload)), extra:extra||{} });
  if(d.trash.length>60) d.trash.length = 60;
  logAct('حذف '+TRASH_TYPES[type]+': '+label);
}
function setting_(k, def){ const v = state.data.settings && state.data.settings[k]; return (v===undefined||v===null||v==='')? def : Number(v); }
function parseGbDate_(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(s); return isNaN(d)? null : d;
}
function daysSince_(d){ return d? Math.floor((Date.now()-d.getTime())/86400000) : null; }
function homeAlerts_(){
  const out = [];
  const staleDays = setting_('staleDays', 60), debtDays = setting_('debtDays', 30);
  const minK = setting_('minKhazina', 0), minU = setting_('minUsd', 0);
  const kb = accountBalance('khazina');
  if(minK>0 && kb<minK) out.push({lv:'bad', text:`رصيد الخزينة منخفض: ${fmt(kb)} د.ل (الحد ${fmt(minK)})`, go:"openAccount('khazina')"});
  const ub = usdCashBalance();
  if(minU>0 && ub<minU) out.push({lv:'bad', text:`الدولار الكاش منخفض: $${fmt(ub)} (الحد $${fmt(minU)})`, go:"goto('usdCashLedger')"});
  const stale = state.data.cars.filter(c=>!c.sold).map(c=>({c, n:daysSince_(parseGbDate_(c.date))})).filter(x=>x.n!==null && x.n>=staleDays).sort((a,b)=>b.n-a.n);
  stale.slice(0,4).forEach(x=>out.push({lv:'warn', text:`${x.c.name} غير مبيوعة منذ ${x.n} يوم`, go:`openCarForm('${x.c.id}')`}));
  if(stale.length>4) out.push({lv:'warn', text:`و${stale.length-4} سيارات أخرى متأخرة عن البيع`, go:"goto('carsList')"});
  const old = [];
  ['toMe','byMe'].forEach(cat=>{
    (state.data.debts[cat]||[]).forEach(p=>{
      if(isSettledPerson(p)) return;
      const dates = (p.entries||[]).map(e=>parseGbDate_(e.date)).filter(Boolean);
      if(!dates.length) return;
      const last = new Date(Math.max.apply(null, dates.map(d=>d.getTime())));
      const n = daysSince_(last);
      if(n>=debtDays) old.push({cat, p, n});
    });
  });
  old.sort((a,b)=>b.n-a.n).slice(0,4).forEach(x=>out.push({lv:'warn', text:`دين ${x.cat==='toMe'?'لك عند':'عليك لـ'} ${x.p.name} (${fmt(debtBalance(x.p))} د.ل) بدون حركة منذ ${x.n} يوم`, go:`openDebtPersonFromSearch('${x.cat}','${x.p.id}')`}));
  if(old.length>4) out.push({lv:'warn', text:`و${old.length-4} ديون قديمة أخرى`, go:"goto('debtsMenu')"});
  return out;
}
function renderHomeAlerts_(){
  const a = homeAlerts_();
  if(!a.length) return '';
  return `<div class="alerts-box">${a.map(x=>`<div class="alert-item ${x.lv}" onclick="${x.go}"><span class="dot"></span><span>${esc(x.text)}</span><span class="arr">›</span></div>`).join('')}</div>`;
}

function profitSplit(){
  const cfg = state.data.profitShares;
  const res = {};
  cfg.partners.forEach(p=>{ res[p.id]=0; });
  state.data.cars.filter(c=>c.sold).forEach(c=>{
    const pr = carProfit(c);
    const pcts = c.profitPercents || Object.fromEntries(cfg.partners.map(p=>[p.id,p.percent]));
    cfg.partners.forEach(p=>{ res[p.id] += pr*(Number(pcts[p.id])||0)/100; });
  });
  return res;
}
function normalizeDbData_(parsed){
  const tr = parsed.transfers||{};
  return ensureProfitShares_({
    cars: parsed.cars||[],
    transfers: {aseem:tr.aseem||[], khazina:tr.khazina||[], ahd:tr.ahd||[], masraf:tr.masraf||[]},
    basicData: parsed.basicData||{capital:0,notes:''},
    debts: parsed.debts||{toMe:[],byMe:[]},
    transferLog: parsed.transferLog||[],
    usdCash: parsed.usdCash||[],
    profitShares: parsed.profitShares,
    trash: parsed.trash, activityLog: parsed.activityLog, settings: parsed.settings
  });
}
function emptyData_(){
  return { cars:[], transfers:{aseem:[],khazina:[],ahd:[],masraf:[]}, basicData:{capital:0,notes:''}, debts:{toMe:[],byMe:[]}, transferLog:[], usdCash:[], profitShares:{partners:DEFAULT_PARTNERS.map(p=>({...p}))}, trash:[], activityLog:[], settings:{} };
}
async function loadData(){
  state.loading = true;
  state.data = emptyData_();
  state.dataDirty = false; state.dataSnapshot = null;
  render();
  try{
    const doc = await db.collection('dealerData').doc(currentUser.uid).get();
    state.data = doc.exists ? normalizeDbData_(doc.data()) : emptyData_();
    state.error=null;
  }catch(e){ state.error='تعذّر تحميل البيانات، تحقق من الاتصال بالإنترنت.'; }
  state.loading=false; render();
}
async function refreshData(){
  if(!currentUser) return;
  if(state.dataDirty){
    state.pendingNavAction = () => doRefreshData();
    state.showUnsavedPrompt = true;
    render();
    return;
  }
  await doRefreshData();
}
async function doRefreshData(){
  state.refreshing = true; render();
  try{
    const doc = await db.collection('dealerData').doc(currentUser.uid).get();
    state.data = doc.exists ? normalizeDbData_(doc.data()) : emptyData_();
    state.error=null;
  }catch(e){ state.error='تعذّر تحديث البيانات، تحقق من الاتصال بالإنترنت.'; }
  state.refreshing = false; render();
}
async function persist(){
  try{
    await db.collection('dealerData').doc(currentUser.uid).set(state.data);
    state.error=null;
  }catch(e){
    const msg = (e && e.message) || '';
    if(msg.indexOf('longer than')>-1 || msg.indexOf('exceeds')>-1 || (e && e.code==='invalid-argument')){
      state.error='تعذّر الحفظ: حجم بياناتك وصل للحد الأقصى المسموح به (بسبب الصور غالبًا). احذف صور قديمة غير ضرورية من بعض السيارات وحاول تاني.';
    }else{
      state.error='تعذّر حفظ البيانات، تحقق من الاتصال بالإنترنت.';
    }
  }
  render();
}

function switchAuthMode(m){ state.authMode=m; state.authError=null; render(); }
async function doLogin(){
  if(!firebaseReady){ state.authError = firebaseInitError; render(); return; }
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if(!email||!pass){ state.authError='أدخل البريد الإلكتروني وكلمة المرور'; render(); return; }
  state.authError=null;
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){ state.authError='بيانات الدخول غير صحيحة'; render(); }
}
async function doSignup(){
  if(!firebaseReady){ state.authError = firebaseInitError; render(); return; }
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if(!email||!pass||pass.length<6){ state.authError='كلمة المرور لازم تكون 6 أحرف على الأقل'; render(); return; }
  state.authError=null;
  try{
    await auth.createUserWithEmailAndPassword(email, pass);
  }catch(e){ state.authError='تعذّر إنشاء الحساب: '+(e.message||'تأكد إن البريد صحيح وغير مستخدم من قبل'); render(); }
}
async function doLogout(){
  await auth.signOut();
  state.data = emptyData_();
  state.dataDirty = false; state.dataSnapshot = null; state.showUnsavedPrompt = false;
}

async function confirmSaveAndProceed(){
  if(state.screen==='carForm' && state.currentCar){
    const ok = mergeCarDraftIntoData_();
    if(!ok){
      /* الاسم فارغ — ما نقدرش نحفظ السيارة، نقفل نافذة التنبيه بس ونخلي المستخدم يكمل تعبئة الاسم
         بدون ما نعيد رسم الصفحة (حتى ما نضيعش البيانات الي كتبها في باقي الحقول) */
      const overlay = document.querySelector('.modal-overlay');
      if(overlay) overlay.remove();
      return;
    }
    state.editingCarId = null;
    state.currentCar = null;
  }
  state.showUnsavedPrompt = false;
  state.dataDirty = false;
  state.dataSnapshot = null;
  /* لازم نغيّر الشاشة (نخرج من فورمة السيارة) قبل ما نحفظ، لأن الحفظ يعيد رسم
     الصفحة، ولو قعدنا في فورمة السيارة و state.currentCar بقى فاضي (null)
     الصفحة تنهار (كنا نمسحه فوق بعد الدمج). فنطلع الأول، بعدين نحفظ. */
  const action = state.pendingNavAction; state.pendingNavAction = null;
  if(action) action(); else render();
  await persist();
}
function discardAndProceed(){
  state.showUnsavedPrompt = false;
  if(state.dataSnapshot) state.data = state.dataSnapshot;
  state.dataDirty = false;
  state.dataSnapshot = null;
  const action = state.pendingNavAction; state.pendingNavAction = null;
  if(action) action(); else render();
}

    state.screen = target;
    render();
  };
  if(state.dataDirty){
    state.pendingNavAction = proceed;
    state.showUnsavedPrompt = true;
    render();
  }else{
    proceed();
  }
}

/* ---------------- CARS LIST (add/edit) ---------------- */
function sortCars_(list){
  const m = state.carSort || 'newest';
  const dt = c=>{ const d = new Date(c.date); return isNaN(d)? 0 : d.getTime(); };
  const a = list.slice();
  if(m==='newest') a.sort((x,y)=>dt(y)-dt(x));
  else if(m==='oldest') a.sort((x,y)=>dt(x)-dt(y));
  else if(m==='expensive') a.sort((x,y)=>carTotal(y)-carTotal(x));
  else if(m==='cheap') a.sort((x,y)=>carTotal(x)-carTotal(y));
  else if(m==='name') a.sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ar'));
  else if(m==='profit') a.sort((x,y)=>(carProfit(y)||-1e12)-(carProfit(x)||-1e12));
  return a;
}
function carSortSelectHtml_(withProfit){
  const m = state.carSort || 'newest';
  const opts = [['newest','الأحدث'],['oldest','الأقدم'],['expensive','الأغلى'],['cheap','الأرخص'],['name','بالاسم']];
  if(withProfit) opts.push(['profit','الأعلى ربحًا']);
  return `<select class="sort-sel" onchange="setCarSort(this.value)">${opts.map(o=>`<option value="${o[0]}" ${m===o[0]?'selected':''}>ترتيب: ${o[1]}</option>`).join('')}</select>`;
}
function carsListData_(){
  const view = state.screen==='viewCars';
  let list = state.data.cars;
  if(view){
    if(state.filter==='sold') list = list.filter(c=>c.sold);
    else if(state.filter==='unsold') list = list.filter(c=>!c.sold);
  }else list = list.filter(c=>!c.sold);
  const q = ((view? state.viewCarsSearch : state.carSearch)||'').trim().toLowerCase();
  if(q) list = list.filter(c=>String(c.name||'').toLowerCase().includes(q) || String(c.vin||'').toLowerCase().includes(q));
  return sortCars_(list);

function markDirty(){ beginDirtyEdit(); }
function onImagePick(ev){
  const file = ev.target.files[0];
  if(!file) return;
  state.currentCar.imageUrl = '';
  { const u = document.getElementById('carImgUrl'); if(u) u.value = ''; }
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 220;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      state.currentCar.image = canvas.toDataURL('image/jpeg',0.45);
      markDirty();
      updateImageBox();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

const VIN_RE = /^[A-HJ-NPR-Z0-9]{17}$/;
function onVinInput(v){
  const c = state.currentCar;
  const vin = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  c.vin = vin;
  const el = document.getElementById('carVin'); if(el && el.value!==vin) el.value = vin;
  markDirty();
  if(VIN_RE.test(vin)) lookupVin(true); else setVinStatus('');
}
async function lookupVin(auto){
  const c = state.currentCar;
  const vin = String(c.vin||'').trim().toUpperCase();
  if(!VIN_RE.test(vin)){ setVinStatus('رقم الهيكل لازم 17 حرف/رقم (بدون الحروف I و O و Q)', 'err'); return; }
  setVinStatus('جاري البحث…');
  try{
    const r = await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json');
    if(!r.ok) throw new Error('http');
    const j = await r.json();
    const d = (j.Results && j.Results[0]) || {};
    if(state.currentCar!==c) return;
    if(!d.Make){ setVinStatus('ما لقيتش بيانات لهالرقم، اكتب الاسم يدويًا.', 'err'); return; }
    const name = [d.Make, d.Model, d.ModelYear].map(x=>String(x||'').trim()).filter(Boolean).join(' ').toUpperCase();
    const nameEl = document.getElementById('carName');
    if(!auto || !c.name || c.name===c._autoName){
      c.name = name; c._autoName = name;
      if(nameEl) nameEl.value = name;
      markDirty();
    }
    const extra = [d.Trim, d.BodyClass, d.DriveType].map(x=>String(x||'').trim()).filter(Boolean).join(' • ');
    setVinStatus('✓ '+name+(extra? ' — '+extra : ''), 'ok');
  }catch(e){
    setVinStatus('تعذّر البحث (تحقق من الإنترنت). اكتب الاسم يدويًا.', 'err');
  }
}

async function addExpenseItem(){
  const labelEl = document.getElementById('expLabelInput');
  const amtEl = document.getElementById('expAmountInput');
  const label = labelEl.value.trim();
  const amount = parseFloat(amtEl.value);
  if(!label || !amount) return;
  const source = state.expenseSource !== 'none' ? state.expenseSource : null;
  const payerSel = document.getElementById('expPayerSelect');
  let payerName = null;
  if(payerSel && payerSel.value!=='none'){
    const idx = parseInt(payerSel.value,10);
    const contrib = state.currentCar.contributors[idx];
    if(contrib){
      contrib.amount = (Number(contrib.amount)||0) + Math.abs(amount);
      payerName = contrib.name;
    }
  }
  if(!Array.isArray(state.currentCar.expenses)) state.currentCar.expenses = [];
  const expId = 'exp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);

function updateCarTotals(){

  let pD = 0;

  }else{

    if(state.currentCar){ state.currentCar.purchaseUSD = pUSD; state.currentCar.purchaseRate = pRate; }
    pD = pUSD*pRate;

    if(a) a.textContent = '$'+fmt(pUSD);

  }
  const sUSD = parseFloat(document.getElementById('sUSD').value)||0;
  const sRate = parseFloat(document.getElementById('sRate').value)||0;
  if(state.currentCar){
    state.currentCar.shippingUSD = sUSD;
    state.currentCar.shippingRate = sRate;

  const exp = (state.currentCar.expenses||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const sD = sUSD*sRate;
  document.getElementById('sTrailA').textContent = '$'+fmt(sUSD);
  document.getElementById('sTrailB').textContent = fmt(sRate);
  document.getElementById('sTrailC').textContent = fmt(sD)+' د.ل';
  document.getElementById('expensesTotalDisplay').textContent = fmt(exp)+' د.ل';
  document.getElementById('carTotalAmt').textContent = fmt(pD+sD+exp);
}
function buildCarFromDraft_(){
  const c = state.currentCar;
  if(!c) return null;
  const nameEl = document.getElementById('carName');
  const name = (c.name!==undefined && c.name!==null ? String(c.name) : (nameEl?nameEl.value:'')).trim();
  if(!name){
    if(nameEl){ nameEl.style.borderColor='var(--rust)'; nameEl.focus(); }
    return null;
  }
  const purchaseCurrency = c.purchaseCurrency==='lyd' ? 'lyd' : 'usd';
  const purchaseUSD = Number(c.purchaseUSD)||0;
  const purchaseLYD = Number(c.purchaseLYD)||0;
  const shippingUSD = Number(c.shippingUSD)||0;
  return {
    id: c.id || ('car_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),
    name, image: c.image||null,
    imageUrl: String(c.imageUrl||'').trim(),
    vin: String(c.vin||'').trim().toUpperCase(),
    date: c.date||'',
    purchaseCurrency,
    purchaseUSD: purchaseCurrency==='usd' ? purchaseUSD : 0,
    purchaseRate: purchaseCurrency==='usd' ? (Number(c.purchaseRate)||0) : 0,
    purchaseLYD: purchaseCurrency==='lyd' ? purchaseLYD : 0,
    purchaseLydSource: purchaseCurrency==='lyd' ? (c.purchaseLydSource||null) : null,
    shippingUSD, shippingRate: Number(c.shippingRate)||0,
    purchaseFromUsdCash: purchaseCurrency==='usd' ? !!c.purchaseFromUsdCash : false,
    shippingFromUsdCash: !!c.shippingFromUsdCash,
    expenses: Array.isArray(c.expenses) ? c.expenses : [],
    contributors: Array.isArray(c.contributors) ? c.contributors : [],
    notes: c.notes||'',
    sold: c.sold||false,
    sellPrice: c.sellPrice||''
  };
}
/* يدمج مسودة نموذج السيارة (state.currentCar) داخل البيانات الحقيقية (state.data.cars)
   هذي الدالة تُستعمل من زر "حفظ" العادي، وأيضًا من زر "احفظ واخرج" العام،
   حتى لو المستخدم خرج من الفورمة بدون ما يرص "حفظ" مباشرة، بيانات السيارة (والمصروفات
   المرتبطة بيها) تنحفظ بنفس اللحظة الي تنخصم فيها القيمة من الحساب. */
function mergeCarDraftIntoData_(){
  const updated = buildCarFromDraft_();
  if(!updated) return false;
  const { name, purchaseUSD, shippingUSD } = updated;

  const old = state.editingCarId ? state.data.cars.find(x=>x.id===state.editingCarId) : null;
  logAct((old?'تعديل سيارة: ':'إضافة سيارة: ')+name);
  const oldPurchaseUsed = (old && old.purchaseFromUsdCash) ? Number(old.purchaseUSD)||0 : 0;
  const newPurchaseUsed = updated.purchaseFromUsdCash ? purchaseUSD : 0;
  const oldShippingUsed = (old && old.shippingFromUsdCash) ? Number(old.shippingUSD)||0 : 0;
  const newShippingUsed = updated.shippingFromUsdCash ? shippingUSD : 0;
  const deltaPurchase = newPurchaseUsed - oldPurchaseUsed;
  const deltaShipping = newShippingUsed - oldShippingUsed;
  if(!Array.isArray(state.data.usdCash)) state.data.usdCash = [];
  const date = new Date().toLocaleDateString('en-GB');
  if(deltaPurchase!==0){
    state.data.usdCash.push({ amount:-deltaPurchase, note:`دفع شراء سيارة: ${name} من الدولار الكاش`, date, carId:updated.id, carField:'purchase' });
  }
  if(deltaShipping!==0){
    state.data.usdCash.push({ amount:-deltaShipping, note:`دفع شحن سيارة: ${name} من الدولار الكاش`, date, carId:updated.id, carField:'shipping' });
  }

  const oldLydSource = (old && old.purchaseCurrency==='lyd') ? (old.purchaseLydSource||null) : null;
  const oldLydAmt = oldLydSource ? (Number(old.purchaseLYD)||0) : 0;
  const newLydSource = updated.purchaseCurrency==='lyd' ? (updated.purchaseLydSource||null) : null;
  const newLydAmt = newLydSource ? (Number(updated.purchaseLYD)||0) : 0;
  const lydChanged = oldLydSource!==newLydSource || oldLydAmt!==newLydAmt;
  if(oldLydSource && lydChanged){
    if(!Array.isArray(state.data.transfers[oldLydSource])) state.data.transfers[oldLydSource] = [];
    state.data.transfers[oldLydSource].push({ amount: oldLydAmt, note:`تعديل سيارة: ${name} — إلغاء سعر الشراء من ${ACCOUNTS[oldLydSource]}`, date, carId:updated.id, carField:'purchase' });
  }
  if(newLydSource && lydChanged){
    if(!Array.isArray(state.data.transfers[newLydSource])) state.data.transfers[newLydSource] = [];
    state.data.transfers[newLydSource].push({ amount: -newLydAmt, note:`دفع شراء سيارة: ${name} من ${ACCOUNTS[newLydSource]}`, date, carId:updated.id, carField:'purchase' });
  }

  if(state.editingCarId){
    const idx = state.data.cars.findIndex(x=>x.id===state.editingCarId);
    state.data.cars[idx] = updated;
  }else{
    state.data.cars.unshift(updated);
  }
  return true;
}

function updateAllocRemaining(sellVal){
  const v = typeof sellVal==='number' ? sellVal : (parseFloat(document.getElementById('sellPriceInput').value)||0);
  const keys = ['aseem','khazina','ahd','masraf','cash'];
  let sum = 0;
  keys.forEach(k=>{ const el = document.getElementById('alloc_'+k); if(el) sum += parseFloat(el.value)||0; });
  const remEl = document.getElementById('allocRemaining');
  if(remEl) remEl.textContent = fmt(v-sum)+' د.ل';
}
function removeSaleAllocationEntries_(carId){
  ['aseem','khazina','ahd','masraf'].forEach(k=>{
    state.data.transfers[k] = state.data.transfers[k].filter(t=>t.saleId!==carId);
  });

async function confirmSell(id, total, forceProceed){
  const v = parseFloat(document.getElementById('sellPriceInput').value);
  if(isNaN(v)){ document.getElementById('sellPriceInput').style.borderColor='var(--rust)'; return; }

  const keys = ['aseem','khazina','ahd','masraf','cash'];
  const alloc = {};
  keys.forEach(k=>{ const el = document.getElementById('alloc_'+k); alloc[k] = el? (parseFloat(el.value)||0) : 0; });
  const sumAlloc = keys.reduce((s,k)=>s+alloc[k],0);
  const remaining = Math.round((v - sumAlloc)*100)/100;

  if(remaining!==0 && !forceProceed){
    state.pendingSell = {id, total, alloc, v, remaining};
    state.showAllocWarning = true;
    render();
    return;
  }

  const idx = state.data.cars.findIndex(c=>c.id===id);
  const car = state.data.cars[idx];
  if(!car.sold){
    car.sellDate = new Date().toISOString().slice(0,10);
  }
  car.sold = true;
  if(!car.profitPercents){ car.profitPercents = Object.fromEntries(state.data.profitShares.partners.map(p=>[p.id,p.percent])); }
  car.sellPrice = v;
  car.saleAllocation = alloc;
  logAct(`بيع سيارة: ${car.name} بسعر ${fmt(v)} د.ل`);

  removeSaleAllocationEntries_(id);
  const date = new Date().toLocaleDateString('en-GB');
  ['aseem','khazina','ahd','masraf'].forEach(k=>{
    if(alloc[k]){
      state.data.transfers[k].push({ amount: alloc[k], note: `بيع سيارة: ${car.name}`, date, saleId: id });
    }
  });

  state.showAllocWarning = false;
  state.pendingSell = null;
  state.dataDirty = false; state.dataSnapshot = null;
  back();
  await persist();
}
async function cancelSale(id){
  const idx = state.data.cars.findIndex(c=>c.id===id);
  logAct('إلغاء بيع سيارة: '+state.data.cars[idx].name);
  removeSaleAllocationEntries_(id);
  state.data.cars[idx].sold = false;
  state.data.cars[idx].sellPrice = '';
  state.data.cars[idx].sellDate = null;
  state.data.cars[idx].saleAllocation = null;
  state.data.cars[idx].profitPercents = null;
  state.dataDirty = false; state.dataSnapshot = null;
  back();
  await persist();
}

function buildMonthlyProfit_(){
  const map = {};
  state.data.cars.filter(c=>c.sold).forEach(c=>{
    const d = c.sellDate || c.date;
    if(!d) return;
    const key = String(d).slice(0,7); // YYYY-MM
    if(!/^\d{4}-\d{2}$/.test(key)) return;
    map[key] = (map[key]||0) + carProfit(c);
  });
  const keys = Object.keys(map).sort();
  return keys.map(k=>{
    const [y,m] = k.split('-');
    return { key:k, label:`${m}/${y.slice(2)}`, total: map[k] };
  });
}
function renderProfitChart(){
  const data = buildMonthlyProfit_();
  if(data.length===0){
    return `
      <div class="topbar"><button class="tbtn" onclick="back()">${ICONS.back}</button><h1>رسم الأرباح الشهري</h1></div>
      <div class="main"><div class="empty">${ICONS.chart}<h3>لا توجد بيانات كافية</h3><p>بع سيارة وحدة على الأقل عشان يبان الرسم</p></div></div>
    `;
  }
  const W = 700, H = 320, padB = 50, padT = 20, padSide = 20;
  const barGap = 14;
  const barW = Math.max(18, Math.min(60, (W - padSide*2)/data.length - barGap));
  const maxAbs = Math.max(1, ...data.map(d=>Math.abs(d.total)));
  const zeroY = padT + (H-padT-padB) * 0.55;
  const posH = H - padT - padB - (H-padT-padB-zeroY+padT);
  const scale = (H - padT - padB) * 0.45 / maxAbs;
  let bars = '';
  data.forEach((d,i)=>{
    const x = padSide + i*(barW+barGap);
    const h = Math.abs(d.total) * scale;
    const y = d.total>=0 ? zeroY - h : zeroY;
    const color = d.total>=0? '#2f6e52' : '#b64d34';
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(2,h)}" rx="3" fill="${color}"/>`;
    bars += `<text x="${x+barW/2}" y="${d.total>=0? y-6 : y+h+16}" text-anchor="middle" font-size="11" fill="${color}" font-family="Cairo">${fmt(d.total)}</text>`;
    bars += `<text x="${x+barW/2}" y="${H-padB+18}" text-anchor="middle" font-size="11" fill="#666" font-family="Cairo">${d.label}</text>`;
  });
  return `
    <div class="topbar"><button class="tbtn" onclick="back()">${ICONS.back}</button><h1>رسم الأرباح الشهري</h1></div>
    <div class="main">
      <div class="section" style="overflow-x:auto;">
        <svg viewBox="0 0 ${Math.max(W, padSide*2 + data.length*(barW+barGap))} ${H}" width="100%" height="${H}" style="min-width:${data.length*70}px;">
          <line x1="0" y1="${zeroY}" x2="${Math.max(W, padSide*2 + data.length*(barW+barGap))}" y2="${zeroY}" stroke="#ccc" stroke-width="1"/>
          ${bars}
        </svg>
      </div>
      <div class="section">
        <h4>التفاصيل بالأرقام</h4>
        ${data.slice().reverse().map(d=>`<div class="kv-row"><span class="k">${d.label}</span><span class="v ${d.total>=0?'pos':'neg'}">${fmt(d.total)} د.ل</span></div>`).join('')}
      </div>
    </div>
  `;
}

async function addDeduction(){
  const amtEl = document.getElementById('dedAmount');
  const amount = parseFloat(amtEl.value);
  if(!amount || amount<=0){ amtEl.style.borderColor='var(--rust)'; return; }
  beginDirtyEdit();
  const cfg = state.data.profitShares;
  const note = document.getElementById('dedNote').value.trim();
  const src = document.getElementById('dedSource').value;
  const source = src==='none' ? null : src;
  const id = 'ded_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const date = new Date().toLocaleDateString('en-GB');
  if(!Array.isArray(cfg.deductions)) cfg.deductions = [];
  cfg.deductions.push({ id, amount, note, date, source, percents:Object.fromEntries(cfg.partners.map(p=>[p.id,p.percent])) });
  if(source){
    state.data.transfers[source].push({ amount:-amount, note:`خصم من المكسب${note?': '+note:''}`, date, deductionRef:id });
  }
  logAct(`خصم من المكسب: ${fmt(amount)} د.ل${note?' — '+note:''}`);
  render();
}
async function removeDeduction(id){
  const cfg = state.data.profitShares;
  const d = (cfg.deductions||[]).find(x=>x.id===id);
  if(!d) return;
  beginDirtyEdit();
  sendToTrash_('deduction', `${fmt(d.amount)} د.ل${d.note?' — '+d.note:''}`, d);
  if(d.source){
    state.data.transfers[d.source] = (state.data.transfers[d.source]||[]).filter(t=>t.deductionRef!==id);
  }
  cfg.deductions = cfg.deductions.filter(x=>x.id!==id);
  render();
}

  render();
}

function carSharesList_(){
  const cfg = state.data.profitShares;
  return state.data.cars.filter(c=>c.sold).map(c=>{
    const pr = carProfit(c);
    const pcts = c.profitPercents || Object.fromEntries(cfg.partners.map(p=>[p.id,p.percent]));
    const shares = {}; cfg.partners.forEach(p=>{ shares[p.id] = pr*(Number(pcts[p.id])||0)/100; });
    return { car:c, profit:pr, pcts, shares, date:c.sellDate||c.date||'' };
  }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function fmtDate_(d){ return d? new Date(d).toLocaleDateString('en-GB'):'—'; }
const PROFIT_REPORT_DEFAULT_FROM = '2026-10-19';
function setProfitPrintFrom(v){ state.profitPrintFrom = v || PROFIT_REPORT_DEFAULT_FROM; render(); }
function profitPrintData_(){
  const cfg = state.data.profitShares;
  const who = state.profitPrintWho||'all';
  const from = state.profitPrintFrom || PROFIT_REPORT_DEFAULT_FROM;
  const fromD = parseAnyDate_(from);
  const after = ()=>true; /* بدون فلترة تاريخ: يطبع كل شي */
  const partners = who==='all' ? cfg.partners : cfg.partners.filter(p=>p.id===who);
  const rows = carSharesList_().filter(r=> after(r.date) && (who==='all' || Math.abs(r.shares[who])>=0.005));
  const n = cfg.partners.length || 1;
  const deds = (cfg.deductions||[]).filter(d=>after(d.date));
  const wds = (cfg.withdrawals||[]).filter(w=>after(w.date) && (who==='all'||w.partnerId===who));
  const sum = {};
  cfg.partners.forEach(p=>{
    const share = rows.reduce((t,r)=>t+r.shares[p.id],0);
    const ded = deds.reduce((t,d)=>t+Number(d.amount||0)/n,0);

    sum[p.id] = { share, ded, wd, net: share-ded-wd };
  });
  return { cfg, who, from, partners, rows, deds, wds, sum };
}

function computeNetWorth(){
  const unsoldCapital = state.data.cars.filter(c=>!c.sold).reduce((s,c)=>s+carTotal(c),0);
  const debtsToMe = (state.data.debts.toMe||[]).reduce((s,p)=>s+debtBalance(p),0);
  const debtsByMe = (state.data.debts.byMe||[]).reduce((s,p)=>s+debtBalance(p),0);
  const balAseem = (state.data.transfers.aseem||[]).reduce((s,t)=>s+Number(t.amount||0),0);
  const balKhazina = (state.data.transfers.khazina||[]).reduce((s,t)=>s+Number(t.amount||0),0);
  const balAhd = (state.data.transfers.ahd||[]).reduce((s,t)=>s+Number(t.amount||0),0);
  const balMasraf = (state.data.transfers.masraf||[]).reduce((s,t)=>s+Number(t.amount||0),0);
  const usdBal = usdCashBalance();
  const usdEntries = state.data.usdCash||[];
  const buys = usdEntries.filter(e=>e.rate && e.amount>0);
  const totalBuyUsd = buys.reduce((s,e)=>s+e.amount,0);
  const avgRate = totalBuyUsd>0 ? buys.reduce((s,e)=>s+e.amount*e.rate,0)/totalBuyUsd : 0;
  const usdInLyd = usdBal*avgRate;
  const baseNet = unsoldCapital + debtsToMe - debtsByMe + balAseem + balKhazina + balAhd + balMasraf;
  return { unsoldCapital, debtsToMe, debtsByMe, balAseem, balKhazina, balAhd, balMasraf, usdBal, avgRate, usdInLyd, baseNet, total: baseNet+usdInLyd };
}

function exportBackup(){
  try{
    const payload = { exportedAt: new Date().toISOString(), data: state.data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `دفتر-التجارة-نسخة-احتياطية-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    state.error = 'تعذّر إنشاء النسخة الاحتياطية.';
    render();
  }
}
function triggerRestore(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = ev=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        const data = (parsed && parsed.data) ? parsed.data : parsed;
        if(!data || !Array.isArray(data.cars)) throw new Error('invalid');
        state.restorePending = {
          cars: data.cars || [],
          transfers: { aseem:(data.transfers&&data.transfers.aseem)||[], khazina:(data.transfers&&data.transfers.khazina)||[], ahd:(data.transfers&&data.transfers.ahd)||[], masraf:(data.transfers&&data.transfers.masraf)||[] },
          basicData: data.basicData || {capital:0,notes:''},
          debts: data.debts || {toMe:[],byMe:[]},
          transferLog: data.transferLog || [],
          usdCash: data.usdCash || [],
          profitShares: data.profitShares,
          trash: data.trash, activityLog: data.activityLog, settings: data.settings
        };
        state.restoreInfo = { carsCount: (data.cars||[]).length, exportedAt: parsed.exportedAt || null };
        state.error = null;
        goto('restoreConfirm');
      }catch(err){
        state.error = 'ملف النسخة الاحتياطية غير صالح أو تالف.';
        render();
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  const usd = Math.abs(parseFloat(amtEl.value));
  if(!usd){ amtEl.style.borderColor='var(--rust)'; return; }
  beginDirtyEdit();
  const sign = state.usdSign||1;
  const note = noteEl.value.trim();
  const date = new Date().toLocaleDateString('en-GB');
  if(!Array.isArray(state.data.usdCash)) state.data.usdCash = [];
  if(sign===1){
    const rateEl = document.getElementById('usdRate');
    const srcEl = document.getElementById('usdSourceAccount');
    const rate = parseFloat(rateEl.value)||0;
    if(!rate){ rateEl.style.borderColor='var(--rust)'; return; }
    const source = srcEl.value;
    const lyd = usd*rate;
    const usdId = 'usd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    state.data.transfers[source].push({ amount:-lyd, note:`شراء دولار كاش ($${fmt(usd)} @ ${fmt(rate)})${note?' — '+note:''}`, date, usdCashRef:usdId });
    state.data.usdCash.push({ id:usdId, amount:usd, rate, sourceAccount:source, note, date });
  }else{
    state.data.usdCash.push({ id:'usd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), amount:-usd, note, date });
  }
  logAct(`دولار كاش: ${sign===1?'شراء':'سحب/بيع'} $${fmt(usd)}${note?' — '+note:''}`);
  amtEl.value=''; noteEl.value='';
  const rateEl2 = document.getElementById('usdRate'); if(rateEl2) rateEl2.value='';
  state.error = null;
  render();
}
async function removeUsdCashEntry(i){
  beginDirtyEdit();
  const entry = state.data.usdCash[i];

    state.data.transfers[entry.sourceAccount].push({ amount: entry.amount*entry.rate, note:`إلغاء شراء دولار كاش`, date });

  if(entry && entry.carId){
    const car = state.data.cars.find(c=>c.id===entry.carId);

  state.data.usdCash.splice(i,1);
  render();
}

async function confirmTransferBetween(){

  if(!amount){ amtEl.style.borderColor='var(--rust)'; return; }
  const from = state.transferFrom, to = state.transferTo;
  if(from===to){ state.error='اختر حسابين مختلفين.'; render(); return; }
  beginDirtyEdit();
  const note = noteEl.value.trim();
  const date = new Date().toLocaleDateString('en-GB');
  const noteSuffix = note? ` — ${note}` : '';
  const transferId = 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  state.data.transfers[from].push({ amount: -amount, note: `تحويل إلى ${ACCOUNTS[to]}${noteSuffix}`, date, transferId });
  state.data.transfers[to].push({ amount: amount, note: `تحويل من ${ACCOUNTS[from]}${noteSuffix}`, date, transferId });
  if(!Array.isArray(state.data.transferLog)) state.data.transferLog = [];
  state.data.transferLog.unshift({ id:transferId, from, to, amount, note, date });
  logAct(`تحويل ${fmt(amount)} د.ل من ${ACCOUNTS[from]} إلى ${ACCOUNTS[to]}`);
  state.error = null;
  amtEl.value=''; noteEl.value='';
  render();
}
async function cancelTransfer(id){

  beginDirtyEdit();

  state.data.transfers[log.to] = state.data.transfers[log.to].filter(t=>t.transferId!==id);

  render();
}

async function addTx(){
  const amtEl = document.getElementById('txAmount');
  const noteEl = document.getElementById('txNote');
  const raw = parseFloat(amtEl.value);
  if(!raw){ amtEl.style.borderColor='var(--rust)'; return; }
  beginDirtyEdit();
  const tx = { amount: Math.abs(raw)*state.txSign, note: noteEl.value.trim(), date: new Date().toLocaleDateString('en-GB') };
  state.data.transfers[state.activeAccount].push(tx);
  logAct(`${ACCOUNTS[state.activeAccount]}: ${tx.amount>0?'+':'−'}${fmt(Math.abs(tx.amount))} د.ل${tx.note?' — '+tx.note:''}`);
  render();
}
async function removeTx(i){
  beginDirtyEdit();
  const acc = state.activeAccount;
  const entry = state.data.transfers[acc][i];
  if(entry){
    logAct(`حذف حركة من ${ACCOUNTS[acc]}: ${fmt(entry.amount)} د.ل${entry.note?' — '+entry.note:''}`);
    if(entry.expenseRef){
      const car = state.data.cars.find(c=>c.id===entry.expenseRef.carId) || (state.currentCar && state.currentCar.id===entry.expenseRef.carId ? state.currentCar : null);
      if(car){
        const exp = (car.expenses||[]).find(e=>e.id===entry.expenseRef.expenseId);
        if(exp) exp.source = null;
      }
    }
    if(entry.deductionRef){
      const ps0 = state.data.profitShares;
      if(ps0 && Array.isArray(ps0.deductions)) ps0.deductions = ps0.deductions.filter(d=>d.id!==entry.deductionRef);
    }
    if(entry.withdrawalRef){
      const ps = state.data.profitShares;
      if(ps && Array.isArray(ps.withdrawals)) ps.withdrawals = ps.withdrawals.filter(w=>w.id!==entry.withdrawalRef);
    }
    if(entry.debtRef){
      const p = (state.data.debts[entry.debtRef.cat]||[]).find(x=>x.id===entry.debtRef.personId);
      if(p){
        const de = (p.entries||[]).find(e=>e.id===entry.debtRef.entryId);
        if(de){ de.linkedAccount = null; de.linkedAmount = null; }
      }
    }
    if(entry.usdCashRef){
      state.data.usdCash = (state.data.usdCash||[]).filter(u=>u.id!==entry.usdCashRef);
    }
    if(entry.saleId){
      const car = state.data.cars.find(c=>c.id===entry.saleId);
      if(car && car.saleAllocation) car.saleAllocation[acc] = 0;
    }
    if(entry.transferId){
      ['aseem','khazina','ahd','masraf'].forEach(k=>{
        if(k!==acc) state.data.transfers[k] = state.data.transfers[k].filter(t=>t.transferId!==entry.transferId);
      });
      if(Array.isArray(state.data.transferLog)) state.data.transferLog = state.data.transferLog.filter(t=>t.id!==entry.transferId);
    }
  }
  state.data.transfers[acc].splice(i,1);
  render();
}

function debtBalance(p){ return (p.entries||[]).reduce((s,e)=>s+Number(e.amount||0),0); }

function isSettledPerson(p){ return (p.entries||[]).length>0 && Math.abs(debtBalance(p))<0.005; }

function debtLinkHint(cat, sign){
  if(cat==='toMe') return sign>0 ? 'من وين تدفع السلفة؟' : 'الدفعة (التحصيل) توصل لوين؟';
  return sign>0 ? 'الفلوس اللي استلفتها توصل لوين؟' : 'من وين تدفع التسديد؟';
}
function debtCashDirection_(cat, sign){
  if(cat==='toMe') return sign>0 ? -1 : 1;
  return sign>0 ? 1 : -1;
}
function setDebtSign(s){
  state.debtSign = s;
  document.getElementById('btnPlus').className = s===1? 'active-plus':'';
  document.getElementById('btnMinus').className = s===-1? 'active-minus':'';
  const lbl = document.getElementById('debtLinkLabel');
  if(lbl) lbl.textContent = debtLinkHint(state.activeDebtCategory, s);
}
async function addDebtEntry(){
  const amtEl = document.getElementById('debtAmount');
  const noteEl = document.getElementById('debtNote');
  const linkEl = document.getElementById('debtAccountLink');
  const raw = parseFloat(amtEl.value);
  if(!raw){ amtEl.style.borderColor='var(--rust)'; return; }
  beginDirtyEdit();
  const cat = state.activeDebtCategory;
  const p = state.data.debts[cat].find(x=>x.id===state.activeDebtPersonId);
  const amount = Math.abs(raw)*state.debtSign;
  const date = new Date().toLocaleDateString('en-GB');
  const note = noteEl.value.trim();
  const linkAccount = linkEl.value;
  const entryId = 'de_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const entry = { id:entryId, amount, note, date };
  if(linkAccount && linkAccount!=='none'){
    const direction = debtCashDirection_(cat, state.debtSign);
    const linkedAmount = Math.abs(raw)*direction;
    entry.linkedAccount = linkAccount;
    entry.linkedAmount = linkedAmount;
    state.data.transfers[linkAccount].push({ amount: linkedAmount, note: `${cat==='toMe'?'دين لـ':'دين من'} ${p.name}${note? ' — '+note:''}`, date, debtRef:{cat, personId:p.id, entryId} });
  }
  p.entries.push(entry);
  logAct(`دين ${cat==='toMe'?'لي':'عليّ'} — ${p.name}: ${amount>0?'+':'−'}${fmt(Math.abs(amount))} د.ل${note?' ('+note+')':''}`);
  render();
}
async function removeDebtEntry(i){
  beginDirtyEdit();
  const cat = state.activeDebtCategory;
  const p = state.data.debts[cat].find(x=>x.id===state.activeDebtPersonId);
  const entry = p.entries[i];
  if(entry && entry.linkedAccount){
    const date = new Date().toLocaleDateString('en-GB');
    state.data.transfers[entry.linkedAccount].push({ amount: -entry.linkedAmount, note: `إلغاء عملية دين مرتبطة — ${p.name}`, date });
  }
  logAct(`حذف قيد دين — ${p.name}: ${entry?fmt(entry.amount):''} د.ل`);
  p.entries.splice(i,1);
  render();
}

function parseAnyDate_(s){
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s+'T00:00:00');
  const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}T00:00:00`);
  return null;
}
function fmtDateDisplay_(s){
  const d = parseAnyDate_(s);
  return d ? d.toLocaleDateString('en-GB') : (s || '—');
}
function buildCashflowEvents_(){
  const events = [];
  state.data.cars.forEach(c=>{
    if(c.date) events.push({date:c.date, label:`شراء سيارة: ${c.name}`, amount:-carTotal(c)});
    if(c.sold){
      const d = c.sellDate || c.date || '';
      events.push({date:d, label:`بيع سيارة: ${c.name}`, amount:Number(c.sellPrice)||0});
    }
  });
  Object.keys(ACCOUNTS).forEach(k=>{
    (state.data.transfers[k]||[]).forEach(t=>{
      events.push({date:t.date||'', label:`${ACCOUNTS[k]}${t.note? ': '+t.note:''}`, amount:Number(t.amount)||0});
    });
  });
  (state.data.debts.toMe||[]).forEach(p=>{
    (p.entries||[]).forEach(e=>{
      events.push({date:e.date||'', label:`سلفة لـ ${p.name}${e.note? ': '+e.note:''}`, amount:-(Number(e.amount)||0)});
    });
  });
  (state.data.debts.byMe||[]).forEach(p=>{
    (p.entries||[]).forEach(e=>{
      events.push({date:e.date||'', label:`دين من ${p.name}${e.note? ': '+e.note:''}`, amount:Number(e.amount)||0});
    });
  });
  return events;
}
function openCashflowReport(){
  if(state.cashflowFrom===undefined) state.cashflowFrom='';
  if(state.cashflowTo===undefined) state.cashflowTo='';

function setCashflowRange(which, val){
  if(which==='from') state.cashflowFrom = val; else state.cashflowTo = val;
  render();
}
function renderCashflowReport(){
  let events = buildCashflowEvents_();
  const fromD = state.cashflowFrom? parseAnyDate_(state.cashflowFrom) : null;
  const toD = state.cashflowTo? parseAnyDate_(state.cashflowTo) : null;
  events = events.filter(e=>{
    const d = parseAnyDate_(e.date);
    if(fromD && (!d || d < fromD)) return false;
    if(toD && (!d || d > toD)) return false;
    return true;
  });
  events.sort((a,b)=>{
    const da = parseAnyDate_(a.date), db = parseAnyDate_(b.date);
    if(!da && !db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return db - da;
  });
  const totalIn = events.filter(e=>e.amount>0).reduce((s,e)=>s+e.amount,0);
  const totalOut = events.filter(e=>e.amount<0).reduce((s,e)=>s+Math.abs(e.amount),0);
  const net = totalIn - totalOut;
  return `
    <div class="topbar no-print"><button class="tbtn" onclick="back()">${ICONS.back}</button><h1>تقرير الحركة المالية</h1></div>
    <div class="main">
      <div class="section no-print">
        <h4>فلترة بفترة زمنية</h4>
        <div class="row2">
          <div class="field"><label>من تاريخ</label><input type="date" value="${esc(state.cashflowFrom||'')}" onchange="setCashflowRange('from', this.value)"></div>
          <div class="field"><label>إلى تاريخ</label><input type="date" value="${esc(state.cashflowTo||'')}" onchange="setCashflowRange('to', this.value)"></div>
        </div>
      </div>
      <div class="save-bar no-print" style="margin-bottom:14px;">
        <button class="btn ghost" onclick="shareCashflowReport()">${ICONS.share} مشاركة</button>
        <button class="btn primary" onclick="window.print()">${ICONS.print} طباعة / حفظ PDF</button>
      </div>
      <div class="report-page">
        <div class="report-head">
          <h2>تقرير الحركة المالية — تسجيل السيارات</h2>
          <div class="report-date">تاريخ الإصدار: ${reportDateStamp()}</div>
          ${(state.cashflowFrom||state.cashflowTo)? `<div class="report-date">الفترة: ${state.cashflowFrom? fmtDateDisplay_(state.cashflowFrom):'البداية'} — ${state.cashflowTo? fmtDateDisplay_(state.cashflowTo):'الآن'}</div>`:''}

          <div><b>${fmt(net)}</b><span>صافي الحركة</span></div>
        </div>
        ${events.length===0? `<div class="empty" style="padding:24px;">لا توجد حركات ضمن هذي الفترة</div>` :
        events.map(e=>`
          <div class="report-row">
            <span class="k">${fmtDateDisplay_(e.date)} — ${esc(e.label)}</span>
            <span class="v" style="color:${e.amount>=0?'var(--green)':'var(--rust)'};">${e.amount>=0?'+':'−'}${fmt(Math.abs(e.amount))} د.ل</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function shareCashflowReport(){
  const events = (()=>{
    let ev = buildCashflowEvents_();
    const fromD = state.cashflowFrom? parseAnyDate_(state.cashflowFrom) : null;
    const toD = state.cashflowTo? parseAnyDate_(state.cashflowTo) : null;
    ev = ev.filter(e=>{
      const d = parseAnyDate_(e.date);
      if(fromD && (!d || d < fromD)) return false;
      if(toD && (!d || d > toD)) return false;
      return true;
    });
    return ev;
  })();
  const totalIn = events.filter(e=>e.amount>0).reduce((s,e)=>s+e.amount,0);
  const totalOut = events.filter(e=>e.amount<0).reduce((s,e)=>s+Math.abs(e.amount),0);
  let text = `*تقرير الحركة المالية — تسجيل السيارات*\nتاريخ الإصدار: ${reportDateStamp()}\n\n`;
  text += `إجمالي الداخل: ${fmt(totalIn)} د.ل\nإجمالي الخارج: ${fmt(totalOut)} د.ل\n*صافي الحركة: ${fmt(totalIn-totalOut)} د.ل*\n`;
  shareText('تقرير الحركة المالية', text);
}

          <div style="display:flex;gap:8px;"><button class="mini-btn go" onclick="restoreTrash('${it.id}')">استرجاع</button><button class="mini-btn rm" onclick="purgeTrash('${it.id}')">${state.purgeConfirm===it.id?'اضغط للتأكيد':'حذف نهائي'}</button></div>
        </div>`;
      }).join('')}
    </div>`;
}
function restoreTrash(id){
  const d = state.data;
  const it = (d.trash||[]).find(x=>x.id===id);
  if(!it) return;
  beginDirtyEdit();
  const date = new Date().toLocaleDateString('en-GB');
  const p = JSON.parse(JSON.stringify(it.payload));
  if(it.type==='car'){
    if(d.cars.some(c=>c.id===p.id)){ state.error='يوجد سيارة بنفس المعرّف بالفعل.'; render(); return; }
    d.cars.unshift(p);
    (p.expenses||[]).forEach(e=>{
      if(e.source && d.transfers[e.source]) d.transfers[e.source].push({ amount:-Math.abs(e.amount), note:`استرجاع سيارة: ${p.name} — ${e.label}`, date, expenseRef:{carId:p.id, expenseId:e.id} });
    });
    if(!Array.isArray(d.usdCash)) d.usdCash = [];
    if(p.purchaseFromUsdCash && Number(p.purchaseUSD)) d.usdCash.push({ amount:-Number(p.purchaseUSD), note:`استرجاع سيارة: ${p.name} — سعر الشراء`, date, carId:p.id, carField:'purchase' });
    if(p.shippingFromUsdCash && Number(p.shippingUSD)) d.usdCash.push({ amount:-Number(p.shippingUSD), note:`استرجاع سيارة: ${p.name} — سعر الشحن`, date, carId:p.id, carField:'shipping' });
    if(p.purchaseCurrency==='lyd' && p.purchaseLydSource && Number(p.purchaseLYD) && d.transfers[p.purchaseLydSource]) d.transfers[p.purchaseLydSource].push({ amount:-Number(p.purchaseLYD), note:`استرجاع سيارة: ${p.name} — سعر الشراء`, date, carId:p.id, carField:'purchase' });
  }else if(it.type==='debtPerson'){
    const cat = (it.extra&&it.extra.cat)||'toMe';
    if(!d.debts[cat]) d.debts[cat] = [];
    d.debts[cat].push(p);
  }else if(it.type==='withdrawal'){
    const cfg = d.profitShares; if(!Array.isArray(cfg.withdrawals)) cfg.withdrawals = [];
    cfg.withdrawals.push(p);
    if(p.source && d.transfers[p.source]){
      const pp = cfg.partners.find(x=>x.id===p.partnerId);
      d.transfers[p.source].push({ amount:-p.amount, note:`سحب من المكسب (مسترجع): ${pp?pp.name:''}${p.note?' — '+p.note:''}`, date, withdrawalRef:p.id });
    }
  }else if(it.type==='deduction'){
    const cfg = d.profitShares; if(!Array.isArray(cfg.deductions)) cfg.deductions = [];
    cfg.deductions.push(p);
    if(p.source && d.transfers[p.source]) d.transfers[p.source].push({ amount:-p.amount, note:`خصم من المكسب (مسترجع)${p.note?': '+p.note:''}`, date, deductionRef:p.id });
  }
  d.trash = d.trash.filter(x=>x.id!==id);
  logAct('استرجاع '+(TRASH_TYPES[it.type]||'')+': '+it.label);
  state.error = null;
  render();
}
function purgeTrash(id){
  if(state.purgeConfirm!==id){ state.purgeConfirm = id; render(); return; }
  beginDirtyEdit();
  state.purgeConfirm = null;
  state.data.trash = state.data.trash.filter(x=>x.id!==id);
  render();
}

function qeEnsure_(){ if(!state.qe) state.qe = { carId:'', rows:[], lastSource:'none', err:null }; return state.qe; }
function qeTotal_(){ return qeEnsure_().rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0); }
function renderQuickExpenses(){
  const q = qeEnsure_();
  const cars = state.data.cars.filter(c=>!c.sold);
  const sel = 'width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;font-family:\'Cairo\';color:var(--ink);';
  return `

    <div class="main">
      ${q.err? `<div class="err-banner">${esc(q.err)}</div>`:''}

        <select style="${sel}" onchange="qeSetCar(this.value)"><option value="">اختر سيارة…</option>${cars.map(c=>`<option value="${c.id}" ${q.carId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="section"><h4>اضغط على بند لإضافته</h4>
        <div class="chips">${EXPENSE_PRESETS.map(p=>`<button class="chip" onclick="qeAdd('${p}')">${p}</button>`).join('')}<button class="chip" onclick="qeAdd('')">+ بند آخر</button></div>
        ${q.rows.length===0? `<div style="color:var(--muted);font-size:13px;">لسه ما أضفت بنود.</div>` : q.rows.map((r,i)=>`
          <div class="qe-row">
            <input type="text" id="qeLbl_${i}" placeholder="البند" value="${esc(r.label)}" oninput="qeSet(${i},'label',this.value)">
            <input type="number" id="qeAmt_${i}" placeholder="المبلغ" value="${esc(r.amount)}" oninput="qeSet(${i},'amount',this.value)">
            <select onchange="qeSet(${i},'source',this.value)"><option value="none">بدون</option>${Object.keys(ACCOUNTS).map(k=>`<option value="${k}" ${r.source===k?'selected':''}>${ACCOUNTS[k]}</option>`).join('')}</select>
            <button class="del" onclick="qeRemove(${i})">✕</button>
          </div>`).join('')}
        <div style="margin-top:10px;font-weight:700;">الإجمالي: <span id="qeTotal">${fmt(qeTotal_())}</span> د.ل</div>
      </div>
      <div class="save-bar"><button class="btn primary" onclick="qeSave()">حفظ المصاريف</button></div>
      </div>
    </div>`;
}
function qeSetCar(v){ qeEnsure_().carId = v; }
function qeAdd(label){
  const q = qeEnsure_();
  q.rows.push({ label, amount:'', source:q.lastSource||'none' });
  render();
  setTimeout(()=>{ const el = document.getElementById('qeAmt_'+(q.rows.length-1)) ; const l = document.getElementById('qeLbl_'+(q.rows.length-1)); const t = label? el : l; if(t) t.focus(); }, 0);
}
function qeRemove(i){ qeEnsure_().rows.splice(i,1); render(); }
function qeSet(i, f, v){
  const q = qeEnsure_();
  if(!q.rows[i]) return;
  q.rows[i][f] = v;
  if(f==='source') q.lastSource = v;
  if(f==='amount'){ const el = document.getElementById('qeTotal'); if(el) el.textContent = fmt(qeTotal_()); }
}
async function qeSave(){
  const q = qeEnsure_();
  const car = state.data.cars.find(c=>c.id===q.carId);
  const rows = q.rows.map(r=>({label:String(r.label||'').trim(), amount:parseFloat(r.amount), source:(r.source&&r.source!=='none')? r.source : null})).filter(r=>r.label && r.amount>0);
  if(!car){ q.err = 'اختر السيارة أولاً.'; render(); return; }
  if(rows.length===0){ q.err = 'أضف بند واحد على الأقل بمبلغ صحيح.'; render(); return; }
  if(!Array.isArray(car.expenses)) car.expenses = [];
  const date = new Date().toLocaleDateString('en-GB');
  rows.forEach(r=>{
    const expId = 'exp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    car.expenses.push({ id:expId, label:r.label, amount:r.amount, source:r.source, payerName:null });
    if(r.source && state.data.transfers[r.source]) state.data.transfers[r.source].push({ amount:-r.amount, note:`مصروف سيارة: ${car.name} — ${r.label}`, date, expenseRef:{carId:car.id, expenseId:expId} });
  });
  logAct(`مصاريف سريعة لـ ${car.name}: ${rows.length} بند بإجمالي ${fmt(rows.reduce((s,r)=>s+r.amount,0))} د.ل`);
  state.qe = null;
  state.dataDirty = false; state.dataSnapshot = null;
  back();
  await persist();
}

// override deleteCar now that state helpers exist
async function deleteCar(){
  if(!confirm_pending){
    confirm_pending = true;
    const btn = document.querySelector('.btn.danger');
    if(btn) btn.textContent = 'اضغط للتأكيد';
    return;
  }
  const car = state.data.cars.find(c=>c.id===state.editingCarId);
  if(car) sendToTrash_('car', car.name, car);
  if(car && Array.isArray(car.expenses)){
    car.expenses.forEach(e=>{
      if(e.source){
        state.data.transfers[e.source].push({ amount: Math.abs(e.amount), note: `إلغاء (حذف سيارة): ${car.name} — ${e.label}`, date: new Date().toLocaleDateString('en-GB') });
      }
    });
  }
  if(car){
    if(!Array.isArray(state.data.usdCash)) state.data.usdCash = [];
    const date = new Date().toLocaleDateString('en-GB');
    if(car.purchaseFromUsdCash && Number(car.purchaseUSD)){
      state.data.usdCash.push({ amount: Number(car.purchaseUSD), note: `إلغاء (حذف سيارة): ${car.name} — سعر الشراء`, date });
    }
    if(car.shippingFromUsdCash && Number(car.shippingUSD)){
      state.data.usdCash.push({ amount: Number(car.shippingUSD), note: `إلغاء (حذف سيارة): ${car.name} — سعر الشحن`, date });
    }
    if(car.purchaseCurrency==='lyd' && car.purchaseLydSource && Number(car.purchaseLYD)){
      if(!Array.isArray(state.data.transfers[car.purchaseLydSource])) state.data.transfers[car.purchaseLydSource] = [];
      state.data.transfers[car.purchaseLydSource].push({ amount: Number(car.purchaseLYD), note: `إلغاء (حذف سيارة): ${car.name} — سعر الشراء`, date });
    }
  }
  state.data.cars = state.data.cars.filter(c=>c.id!==state.editingCarId);
  state.editingCarId=null; state.currentCar=null;
  state.dataDirty = false; state.dataSnapshot = null;
  back();
  await persist();
}
